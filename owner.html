<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<title>Owner dashboard · لوحة صاحب المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
.wrap{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:env(safe-area-inset-top)}
.shop{display:flex;align-items:center;gap:12px;margin-inline-end:auto;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none}
.shop h1{font-size:19px;margin:0;line-height:1.2}
.shop small{color:var(--muted);font-size:13px}
.notice{margin-top:18px;border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.notice b{font-size:17px;display:block}
.notice p{margin:2px 0 0}
.notice .btn{margin-inline-start:auto}
.notice.trial{background:var(--card)}
.notice.trial .days{font-size:34px;font-weight:800;line-height:1;color:var(--teal);min-width:52px;text-align:center}
.notice.paid{background:var(--good-soft);color:#14532D}
.notice.grace{background:var(--bad);color:#fff}
.notice.grace .btn{background:#fff;color:var(--bad);border-color:#fff;font-weight:700}
.notice.blocked{background:var(--ink);color:#fff}
.notice.blocked .btn{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.welcome{margin-top:18px;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px}
.welcome h2{margin:0 0 12px;font-size:20px}
.welcome ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;color:#D5DCE7}
.welcome ol b{color:#fff}
.welcome .x{float:inline-end;background:transparent;border:0;color:#C9D2E0;font-size:14px}
h2.sec{font-size:17px;margin:30px 4px 12px;display:flex;align-items:center;gap:10px}
h2.sec small{color:var(--muted);font-weight:400;font-size:13.5px}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.br{background:var(--card);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,32,51,.05);min-width:0}
.br h3{margin:0;font-size:18px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fig{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px}
.fig b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.fig span{font-size:11.5px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links .btn{padding:11px 10px}
.staff{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.staff h4{margin:0;font-size:13.5px;color:var(--muted);font-weight:500}
.person{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;flex:1;text-align:start}
.person .btn{padding:5px 10px;font-size:13px}
.addstaff{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px}
.addstaff input{min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;background:var(--sunk);font-size:14px}
.addstaff .btn{padding:9px 12px;font-size:14px}
@media (max-width:420px){.addstaff{grid-template-columns:1fr 1fr}.addstaff .btn{grid-column:1/-1}}
.msg{font-size:13px;margin:0;min-height:1em}
.msg.bad{color:var(--bad)}
.msg.good{color:var(--good)}
.addbr{background:transparent;border:2px dashed var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.addbr input{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--card)}
.addbr p{margin:0;color:var(--muted);font-size:14px}
.brand{background:var(--card);border-radius:var(--r-lg);padding:18px;display:grid;grid-template-columns:minmax(0,2fr) 90px 110px auto;gap:12px;align-items:end}
@media (max-width:700px){.brand{grid-template-columns:1fr 1fr}}
.brand label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.brand input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;background:var(--sunk)}
.brand input[type=color]{height:46px;padding:4px}

/* ---------- page designer ---------- */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
#designer .wrap{padding-top:0}
.dz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.dz{grid-template-columns:1fr}}
.dform{display:flex;flex-direction:column;gap:14px}
.dcard{background:var(--card);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.dcard h3{margin:0;font-size:15px}
.dcard small{color:var(--muted)}
.drow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.dfield{display:flex;flex-direction:column;gap:5px;flex:none;min-width:0}
.drow > .dfield{flex:1 1 160px}
.dfield label{font-size:12.5px;color:var(--muted)}
.dfield input:not([type=color]),.dfield select,.dfield textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--sunk);width:100%;font:inherit}
.dfield input[type=color]{height:44px;width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px;background:var(--sunk)}
.thumb{width:72px;height:72px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:12px;border:1px dashed var(--line)}
.thumb.wide{width:144px}
.thumb img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.offerbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.offerbox .fields{display:flex;flex-direction:column;gap:8px}
.preview{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.phone{width:300px;height:620px;border-radius:44px;background:#141C28;padding:10px;box-shadow:0 24px 50px -24px rgba(20,32,51,.5)}
.phone iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff}
.dbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:5}
.dbar .msg{margin:0}
.locked{background:var(--card);border-radius:var(--r-lg);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.locked b{font-size:17px}
.locked p{margin:4px 0 0;color:var(--muted)}
.locked .btn{margin-inline-start:auto}
.unsaved{color:#B45309;font-size:13px;font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<div id="designer"></div>
<script type="module">
import { db, esc, ms, mmss, dayKey, requireStaff, logout, getLang, setLang, makeT, showFatal, callFn, accountState, whatsappLink, SUPPORT_NUMBER, param } from "./shared.js";
import { collection, doc, query, where, onSnapshot, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TX = {
  ar: {
    lang:"English", out:"خروج", owner:"لوحة صاحب المطعم",
    trialT:"تجربة مجانية", trialL:"يوماً متبقياً. تنتهي في {d}.", trialPay:"اشترك الآن",
    paidT:"الاشتراك فعّال", paidL:"مدفوع حتى {d}.",
    graceT:"انتهت التجربة. ادفع خلال {n} أيام", graceL:"بعدها تتوقف الطلبات الجديدة في كل الفروع حتى الدفع. بياناتك محفوظة.",
    blockedT:"الطلبات الجديدة متوقفة", blockedL:"انتهت الفترة. ادفع لإعادة تشغيل كل الفروع فوراً. بياناتك محفوظة.",
    payWa:"ادفع عبر واتساب", suspT:"الحساب موقوف مؤقتاً", suspL:"الطلبات الجديدة متوقفة في كل الفروع. تواصل معنا لإعادة تشغيل الحساب.", payNoWa:"تواصل معنا للدفع", payMsg:"مرحباً، أريد دفع اشتراك {r} (الحساب {id}).",
    welT:"حسابك جاهز. ابدأ بثلاث خطوات:", hide:"إخفاء",
    w1:"<b>على تابلت الكاشير:</b> افتح «شاشة الموظفين» للفرع وسجّل الدخول.",
    w2:"<b>على شاشة مقابل الزبون:</b> افتح «شاشة الزبائن» واضغط ملء الشاشة.",
    w3:"<b>عند كل طلب:</b> اضغط «طلب جديد»، والزبون يمسح الرمز. عندما يجهز، اضغط «جاهز».",
    branches:"الفروع", branchesS:"{n} من {m}", today:"اليوم",
    fOrders:"طلبات", fDone:"استلام", fPrep:"تحضير", fRating:"تقييم",
    staffScr:"شاشة الموظفين", custScr:"شاشة الزبائن",
    logins:"حسابات موظفي هذا الفرع", noLogins:"لا توجد حسابات بعد. أضف حساباً لكل جهاز أو موظف.",
    email:"البريد", pass:"كلمة المرور", add:"إضافة", remove:"حذف", sure:"تأكيد الحذف",
    added:"تمت إضافة الحساب. سجّل الدخول به على جهاز الفرع.", removed:"تم حذف الحساب.",
    addBr:"إضافة فرع", brPh:"اسم الفرع، مثال: المالكي", addBrBtn:"أضف الفرع", limit:"وصلت للحد الأقصى ({m} فروع) خلال التجربة. اشترك لإضافة المزيد.",
    brandT:"هوية المطعم", brandS:"تظهر في كل الفروع وصفحة الزبون", bName:"اسم المطعم", bInitial:"حرف الشعار", bColor:"اللون", save:"حفظ", saved:"تم الحفظ.",
    errs:{ "already-exists":"هذا البريد مستخدم.", "invalid-argument":"تأكد من البيانات المدخلة.", "resource-exhausted":"وصلت للحد الأقصى من الفروع.", "permission-denied":"هذه العملية لصاحب الحساب فقط.", generic:"تعذّر تنفيذ العملية. تأكد من الاتصال." }
  },
  en: {
    lang:"عربي", out:"Sign out", owner:"Owner dashboard",
    trialT:"Free trial", trialL:"days left. Ends on {d}.", trialPay:"Subscribe now",
    paidT:"Subscription active", paidL:"Paid until {d}.",
    graceT:"Your trial has ended. Pay within {n} days", graceL:"After that, new orders stop in every branch until payment. Your data is kept.",
    blockedT:"New orders are paused", blockedL:"Your period has ended. Pay to switch every branch back on right away. Your data is kept.",
    payWa:"Pay via WhatsApp", suspT:"Account paused", suspL:"New orders are stopped in every branch. Contact us to switch the account back on.", payNoWa:"Contact us to pay", payMsg:"Hello, I'd like to pay the subscription for {r} (account {id}).",
    welT:"Your account is ready. Start in three steps:", hide:"Hide",
    w1:"<b>On the cashier's tablet:</b> open the branch's Staff screen and sign in.",
    w2:"<b>On a screen facing the customer:</b> open the Customer screen and tap Full screen.",
    w3:"<b>For each order:</b> tap New order and the customer scans the code. When it's ready, tap Ready.",
    branches:"Branches", branchesS:"{n} of {m}", today:"Today",
    fOrders:"Orders", fDone:"Picked up", fPrep:"Prep", fRating:"Rating",
    staffScr:"Staff screen", custScr:"Customer screen",
    logins:"Staff logins for this branch", noLogins:"No logins yet. Add one for each device or employee.",
    email:"Email", pass:"Password", add:"Add", remove:"Remove", sure:"Confirm remove",
    added:"Login added. Sign in with it on the branch's device.", removed:"Login removed.",
    addBr:"Add a branch", brPh:"Branch name, e.g. Malki", addBrBtn:"Add branch", limit:"You've reached the limit ({m} branches) during the trial. Subscribe to add more.",
    brandT:"Restaurant identity", brandS:"Used in every branch and on the customer page", bName:"Restaurant name", bInitial:"Logo letter", bColor:"Colour", save:"Save", saved:"Saved.",
    errs:{ "already-exists":"This email is already used.", "invalid-argument":"Check what you entered.", "resource-exhausted":"Branch limit reached.", "permission-denied":"Only the account owner can do this.", generic:"Couldn't do that. Check the connection." }
  }
};
const t = makeT(TX);
const root = document.getElementById("root");
let acc = null, accountId = null, stats = {}, subs = [], msgs = {}, confirmRm = null, showWelcome = param("welcome") === "1", busy = false;
window.addEventListener("unhandledrejection", e => showFatal(root, e.reason));
const errText = e => { const c = String(e?.code || "").replace("functions/", ""); return (TX[getLang()].errs[c]) || TX[getLang()].errs.generic; };
const fmtDate = m => new Date(m).toLocaleDateString(getLang() === "ar" ? "ar-SY" : "en-GB", { day: "numeric", month: "long", year: "numeric" });

requireStaff(root, ctx => {
  accountId = ctx.accountId;
  onSnapshot(doc(db, "accounts", accountId), s => { acc = s.data(); watchBranches(); render();
    window.dispatchEvent(new CustomEvent("pg-acc", { detail: { accountId, acc } })); }, err => showFatal(root, err));
}, { ownerOnly: true });

function watchBranches(){
  const ids = Object.keys(acc?.branches || {}).sort();
  if (ids.join() === subs.map(s => s.id).join()) return;
  subs.forEach(s => s.off()); subs = [];
  const day = dayKey();
  for (const id of ids){
    const off = onSnapshot(query(collection(db, "venues", id, "tickets"), where("day", "==", day)), snap => {
      const tk = snap.docs.map(d => d.data()), done = tk.filter(x => x.status === "collected");
      const waits = done.map(x => (ms(x.readyAt)||0) - (ms(x.linkedAt) || ms(x.createdAt) || 0)).filter(x => x > 0);
      const rated = done.filter(x => x.rating);
      stats[id] = { orders: tk.filter(x => x.status !== "cancelled").length, done: done.length,
        prep: waits.length ? mmss(waits.reduce((a,b)=>a+b,0)/waits.length) : "—",
        rating: rated.length ? (rated.reduce((a,x)=>a+x.rating,0)/rated.length).toFixed(1) : "—" };
      render();
    }, () => {});
    subs.push({ id, off });
  }
}

function statusNotice(){
  const st = accountState(acc), wa = whatsappLink(t("payMsg", { r: acc.name, id: accountId }));
  const pay = label => wa ? `<a class="btn" href="${wa}" target="_blank" rel="noopener">${label}</a>` : `<span class="btn" style="cursor:default">${t("payNoWa")}${SUPPORT_NUMBER ? " " + esc(SUPPORT_NUMBER) : ""}</span>`;
  if (st.state === "trial") return `<div class="notice trial"><div class="days num">${st.daysLeft}</div><div><b>${t("trialT")}</b><p>${t("trialL", { d: fmtDate(st.end) })}</p></div>${pay(t("trialPay"))}</div>`;
  if (st.state === "paid") return `<div class="notice paid"><div><b>${t("paidT")}</b><p>${t("paidL", { d: fmtDate(st.end) })}</p></div></div>`;
  if (st.state === "grace") return `<div class="notice grace" role="alert"><div><b>${t("graceT", { n: st.daysLeft })}</b><p>${t("graceL")}</p></div>${pay(t("payWa"))}</div>`;
  if (st.state === "suspended") return `<div class="notice blocked" role="alert"><div><b>${t("suspT")}</b><p>${t("suspL")}</p></div>${pay(t("payNoWa"))}</div>`;
  if (st.state === "blocked") return `<div class="notice blocked" role="alert"><div><b>${t("blockedT")}</b><p>${t("blockedL")}</p></div>${pay(t("payWa"))}</div>`;
  return "";
}

function branchCard(id, name){
  const s = stats[id] || { orders: "…", done: "…", prep: "…", rating: "…" };
  const staff = Object.entries(acc.staff || {}).filter(([, v]) => v.venueId === id);
  const m = msgs[id];
  return `<article class="br"><h3>${esc(name)}</h3>
    <div class="figs" aria-label="${t("today")}">
      <div class="fig"><b>${s.orders}</b><span>${t("fOrders")}</span></div><div class="fig"><b>${s.done}</b><span>${t("fDone")}</span></div>
      <div class="fig"><b>${s.prep}</b><span>${t("fPrep")}</span></div><div class="fig"><b>${s.rating}</b><span>${t("fRating")}</span></div></div>
    <div class="links"><a class="btn primary" href="staff.html?v=${encodeURIComponent(id)}">${t("staffScr")}</a><a class="btn" href="display.html?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">${t("custScr")}</a></div>
    <div class="staff"><h4>${t("logins")}</h4>
      ${staff.length ? staff.map(([uid, v]) => `<div class="person"><span>${esc(v.email)}</span>
        <button class="btn ${confirmRm === uid ? "primary" : "quiet"}" data-act="rm" data-uid="${uid}" data-v="${id}">${confirmRm === uid ? t("sure") : t("remove")}</button></div>`).join("")
        : `<p class="msg" style="color:var(--muted)">${t("noLogins")}</p>`}
      <form class="addstaff" data-v="${id}"><input name="email" type="email" dir="ltr" placeholder="${t("email")}" required autocomplete="off"><input name="password" type="text" dir="ltr" placeholder="${t("pass")}" minlength="6" required autocomplete="off"><button class="btn" type="submit">${t("add")}</button></form>
      <p class="msg ${m?.ok ? "good" : "bad"}">${m ? esc(m.text) : ""}</p></div>
  </article>`;
}

function render(){
  if (!acc) return;
  const active = document.activeElement, focusSel = active?.name ? `form[data-v="${active.form?.dataset.v}"] [name="${active.name}"]` : active?.id ? "#" + active.id : null;
  const typed = [...document.querySelectorAll("input")].map(i => [i.id || (i.form?.dataset.v + ":" + i.name), i.value]);
  const ids = Object.entries(acc.branches || {}).sort((a,b) => a[1].localeCompare(b[1]));
  const max = acc.maxBranches || 3, atLimit = ids.length >= max;
  root.innerHTML = `<div class="wrap">
    <header class="bar"><div class="shop"><div class="mark" style="background:${esc(acc.color || "#7A2E3A")}">${esc(acc.initial || acc.name.slice(0,1))}</div>
      <div><h1>${esc(acc.name)}</h1><small>${t("owner")}</small></div></div>
      <button class="btn quiet" data-act="lang">${t("lang")}</button><button class="btn quiet" data-act="logout">${t("out")}</button></header>
    ${statusNotice()}
    ${showWelcome ? `<div class="welcome"><button class="x" data-act="hidewel">${t("hide")}</button><h2>${t("welT")}</h2><ol><li>${t("w1")}</li><li>${t("w2")}</li><li>${t("w3")}</li></ol></div>` : ""}
    <h2 class="sec">${t("branches")} <small>${t("branchesS", { n: ids.length, m: max })} · ${t("today")}</small></h2>
    <div class="branches">${ids.map(([id, name]) => branchCard(id, name)).join("")}
      <form class="addbr" id="abf"><b>${t("addBr")}</b>
        ${atLimit ? `<p>${t("limit", { m: max })}</p>` : `<input id="abn" placeholder="${t("brPh")}" maxlength="40" required><button class="btn primary" type="submit" ${busy ? "disabled" : ""}>${t("addBrBtn")}</button>`}
        <p class="msg bad">${msgs.branch ? esc(msgs.branch) : ""}</p></form>
    </div>
    <h2 class="sec">${t("brandT")} <small>${t("brandS")}</small></h2>
    <form class="brand" id="bf"><div><label for="bn">${t("bName")}</label><input id="bn" value="${esc(acc.name)}" maxlength="60" required></div>
      <div><label for="bi">${t("bInitial")}</label><input id="bi" value="${esc(acc.initial || "")}" maxlength="2"></div>
      <div><label for="bc">${t("bColor")}</label><input id="bc" type="color" value="${esc(acc.color || "#7A2E3A")}"></div>
      <button class="btn primary" type="submit">${t("save")}</button></form>
    <p class="msg good" style="margin:8px 4px">${msgs.brand ? esc(msgs.brand) : ""}</p>
  </div>`;
  for (const [k, v] of typed){ if (!v) continue; const el = k.includes(":") ? document.querySelector(`form[data-v="${k.split(":")[0]}"] [name="${k.split(":")[1]}"]`) : document.getElementById(k); if (el && el.type !== "color" && !["bn","bi"].includes(el.id)) el.value = v; }
  if (focusSel){ const f = document.querySelector(focusSel); if (f) f.focus(); }
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "lang"){ setLang(getLang() === "ar" ? "en" : "ar"); render(); }
  if (a === "logout") logout();
  if (a === "hidewel"){ showWelcome = false; history.replaceState(null, "", "owner.html"); render(); }
  if (a === "rm"){
    const uid = b.dataset.uid, v = b.dataset.v;
    if (confirmRm !== uid){ confirmRm = uid; render(); return; }
    confirmRm = null;
    try { await callFn("removeStaff", { uid }); msgs[v] = { ok: true, text: t("removed") }; } catch(x){ msgs[v] = { ok: false, text: errText(x) }; }
    render();
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.classList.contains("addstaff")){
    const v = f.dataset.v, email = f.email.value.trim(), password = f.password.value;
    try {
      await callFn("addStaff", { venueId: v, email, password }); msgs[v] = { ok: true, text: t("added") };
      // the card may have been redrawn by a live update meanwhile, so clear the current fields
      document.querySelectorAll(`form.addstaff[data-v="${v}"] input`).forEach(i => i.value = "");
    }
    catch(x){ msgs[v] = { ok: false, text: errText(x) }; }
    render();
    document.querySelectorAll(`form.addstaff[data-v="${v}"] input`).forEach(i => { if (msgs[v]?.ok) i.value = ""; });
  }
  if (f.id === "abf"){
    const name = document.getElementById("abn")?.value.trim(); if (!name || busy) return;
    busy = true; msgs.branch = ""; render();
    try { await callFn("addBranch", { branch: name }); const el = document.getElementById("abn"); if (el) el.value = ""; }
    catch(x){ msgs.branch = errText(x); }
    busy = false; render();
  }
  if (f.id === "bf"){
    const name = document.getElementById("bn").value.trim(), initial = document.getElementById("bi").value.trim(), color = document.getElementById("bc").value;
    if (!name) return;
    try {
      const batch = writeBatch(db);
      batch.update(doc(db, "accounts", accountId), { name, initial, color });
      for (const id of Object.keys(acc.branches || {})) batch.update(doc(db, "venues", id), { name, initial, color });
      await batch.commit();
      msgs.brand = t("saved");
    } catch(x){ msgs.brand = errText(x); }
    render();
  }
});
</script>
<script type="module">
// Waiting-page designer: each branch designs its own customer page (logo, cover, colours, offers, links).
import { db, esc, getLang, makeT, whatsappLink, SUPPORT_NUMBER } from "./shared.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TX = {
  ar: {
    title:"تصميم صفحة الانتظار", sub:"ما يراه الزبون بعد مسح الرمز. لكل فرع تصميمه وعروضه.",
    lockedT:"صفحة انتظار بهوية مطعمك", lockedL:"ضع شعارك وصورة الغلاف وعروضاً يراها الزبون أثناء الانتظار. متاحة في الخطة المميزة.", lockedBtn:"اطلب التفعيل", lockedMsg:"مرحباً، أريد تفعيل تصميم صفحة الانتظار لحساب {r}.",
    identity:"الهوية", logo:"الشعار", cover:"صورة الغلاف", choose:"اختر صورة", remove:"إزالة", none:"لا يوجد",
    brand:"اللون الرئيسي", bg:"لون الخلفية", welcome:"جملة ترحيب", welcomePh:"مثال: أهلاً فيك، قهوتك عم تتحضر ☕",
    offers:"عروض أثناء الانتظار", offersS:"حتى 3 عروض. تظهر تحت رقم الطلب.", offer:"عرض {n}", oTitle:"العنوان", oTitlePh:"مثال: كرواسون مع القهوة", oText:"وصف قصير", oPrice:"السعر", oPricePh:"مثال: 10,000 ل.س", addOffer:"+ أضف عرضاً",
    links:"روابط", instagram:"إنستغرام (اسم الحساب أو الرابط)", whatsapp:"رقم واتساب", menu:"رابط القائمة", map:"رابط الموقع على الخريطة",
    thanks:"رسالة بعد الاستلام", thanksPh:"مثال: شكراً لزيارتك! نراك قريباً",
    publish:"نشر التصميم", published:"تم النشر. الزبائن يرون التصميم الجديد الآن.", unsaved:"تغييرات غير منشورة", copyFrom:"انسخ من فرع", copied:"تم النسخ. راجع واضغط «نشر التصميم».",
    pWaiting:"الانتظار", pReady:"جاهز", pAfter:"بعد الاستلام", imgErr:"تعذّر قراءة الصورة. جرّب صورة JPG أو PNG.", saveErr:"تعذّر النشر. تأكد من الاتصال، وأن الصور ليست كبيرة جداً.", loading:"جارٍ التحميل…"
  },
  en: {
    title:"Waiting page design", sub:"What customers see after scanning. Each branch has its own design and offers.",
    lockedT:"A waiting page in your brand", lockedL:"Add your logo, a cover photo and offers customers see while they wait. Available on the branded plan.", lockedBtn:"Ask to switch it on", lockedMsg:"Hello, I'd like to switch on the waiting page design for {r}.",
    identity:"Identity", logo:"Logo", cover:"Cover photo", choose:"Choose image", remove:"Remove", none:"None",
    brand:"Main colour", bg:"Background", welcome:"Welcome line", welcomePh:"e.g. Welcome! Your coffee is being made ☕",
    offers:"Offers while waiting", offersS:"Up to 3 offers, shown under the order number.", offer:"Offer {n}", oTitle:"Title", oTitlePh:"e.g. Croissant with your coffee", oText:"Short description", oPrice:"Price", oPricePh:"e.g. 10,000 SYP", addOffer:"+ Add an offer",
    links:"Links", instagram:"Instagram (handle or link)", whatsapp:"WhatsApp number", menu:"Menu link", map:"Map location link",
    thanks:"Message after pickup", thanksPh:"e.g. Thanks for visiting! See you soon",
    publish:"Publish design", published:"Published. Customers see the new design now.", unsaved:"Unpublished changes", copyFrom:"Copy from branch", copied:"Copied. Check it and tap Publish design.",
    pWaiting:"Waiting", pReady:"Ready", pAfter:"After pickup", imgErr:"Couldn't read that image. Try a JPG or PNG.", saveErr:"Couldn't publish. Check the connection and that the images aren't too large.", loading:"Loading…"
  }
};
const t = makeT(TX);
const box = document.getElementById("designer");
const BGS = ["#F2F4F7", "#FFFFFF", "#FFF7EC", "#F1F7F2", "#F4F1FA", "#FDF1F1"];
let accountId = null, acc = null, allowedAll = false, branch = null, venues = {}, drafts = {}, saved = {}, state = "waiting", msg = "", busy = false, frameReady = false;

window.addEventListener("pg-acc", async e => {
  const first = !acc; accountId = e.detail.accountId; acc = e.detail.acc;
  if (first){ try { const g = await getDoc(doc(db, "settings", "global")); allowedAll = g.exists() && g.data().designForAll === true; } catch(_){} }
  const ids = Object.keys(acc.branches || {});
  if (!branch || !ids.includes(branch)) branch = ids.sort((a,b) => acc.branches[a].localeCompare(acc.branches[b]))[0] || null;
  if (branch && !drafts[branch]) await loadBranch(branch);
  render();
});
const allowed = () => allowedAll || acc?.pageDesign === true;

async function loadBranch(id){
  const [v, d] = await Promise.all([getDoc(doc(db, "venues", id)), getDoc(doc(db, "venues", id, "public", "design")).catch(() => null)]);
  venues[id] = v.exists() ? v.data() : {};
  const data = d && d.exists() ? d.data() : {};
  delete data.updatedAt;
  saved[id] = JSON.stringify(data);
  drafts[id] = { offers: [], links: {}, ...JSON.parse(saved[id]) };
}
const dirty = () => branch && JSON.stringify(clean(drafts[branch])) !== JSON.stringify(clean(JSON.parse(saved[branch] || "{}")));
function clean(d){
  const o = { ...d }; o.offers = (o.offers || []).filter(x => x && (x.title || x.text || x.image)); o.links = Object.fromEntries(Object.entries(o.links || {}).filter(([, v]) => v));
  for (const k of Object.keys(o)) if (o[k] === "" || o[k] == null || (Array.isArray(o[k]) && !o[k].length) || (k === "links" && !Object.keys(o[k]).length)) delete o[k];
  return o;
}

// Shrinks photos in the browser so the customer page stays fast on slow connections.
function shrink(file, maxW, maxH, maxBytes){
  return new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onerror = bad;
    fr.onload = () => { const img = new Image(); img.onerror = bad; img.onload = () => {
      const k = Math.min(1, maxW / img.width, maxH / img.height), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; const cx = c.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      let q = 0.82, out = c.toDataURL("image/jpeg", q);
      while (out.length > maxBytes && q > 0.35){ q -= 0.08; out = c.toDataURL("image/jpeg", q); }
      out.length > maxBytes ? bad(new Error("too big")) : ok(out);
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

function sendPreview(){
  const f = document.getElementById("pframe"); if (!f || !frameReady || !branch) return;
  f.contentWindow.postMessage({ type: "pg-preview", venue: { ...venues[branch], designAllowed: true }, design: clean(drafts[branch]), state }, location.origin);
}
window.addEventListener("message", e => { if (e.origin === location.origin && e.data?.type === "pg-preview-ready"){ frameReady = true; sendPreview(); } });

function imgField(key, label, wide){
  const v = drafts[branch][key];
  return `<div class="drow" style="align-items:center"><div class="thumb ${wide ? "wide" : ""}">${v ? `<img src="${v}" alt="">` : t("none")}</div>
    <div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:14px">${label}</b><div class="drow"><span class="btn filebtn">${t("choose")}<input type="file" accept="image/*" data-img="${key}"></span>${v ? `<button class="btn quiet" data-dact="rmimg" data-k="${key}">${t("remove")}</button>` : ""}</div></div></div>`;
}

function render(){
  if (!acc){ box.innerHTML = ""; return; }
  const wa = whatsappLink(t("lockedMsg", { r: acc.name }));
  if (!allowed()){
    box.innerHTML = `<div class="wrap"><h2 class="sec">${t("title")}</h2><div class="locked"><div><b>${t("lockedT")}</b><p>${t("lockedL")}</p></div>
      ${wa ? `<a class="btn primary" href="${wa}" target="_blank" rel="noopener">${t("lockedBtn")}</a>` : (SUPPORT_NUMBER ? `<span class="btn">${esc(SUPPORT_NUMBER)}</span>` : "")}</div></div>`;
    return;
  }
  if (!branch || !drafts[branch]){ box.innerHTML = `<div class="wrap"><h2 class="sec">${t("title")}</h2><p class="muted">${t("loading")}</p></div>`; return; }
  const d = drafts[branch], ids = Object.entries(acc.branches || {}).sort((a,b) => a[1].localeCompare(b[1]));
  const others = ids.filter(([id]) => id !== branch);
  const offers = d.offers || [];
  box.innerHTML = `<div class="wrap">
    <h2 class="sec">${t("title")} <small>${t("sub")}</small></h2>
    ${ids.length > 1 ? `<div class="seg" role="tablist" style="margin-bottom:14px;background:var(--card)">${ids.map(([id, n]) => `<button data-dact="branch" data-v="${id}" aria-pressed="${id === branch}" style="padding:8px 14px">${esc(n)}</button>`).join("")}</div>` : ""}
    <div class="dz">
      <div class="dform">
        <section class="dcard"><h3>${t("identity")}</h3>
          ${imgField("logo", t("logo"))}${imgField("cover", t("cover"), true)}
          <div class="drow"><div class="dfield" style="flex:0 1 140px"><label for="d-brand">${t("brand")}</label><input type="color" id="d-brand" value="${esc(d.brand || venues[branch].color || "#7A2E3A")}"></div>
            <div class="dfield"><label>${t("bg")}</label><div class="sw">${BGS.map(c => `<button type="button" data-dact="bg" data-v="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${(d.bg || "#F2F4F7") === c}"></button>`).join("")}</div></div></div>
          <div class="dfield"><label for="d-welcome">${t("welcome")}</label><input id="d-welcome" maxlength="100" placeholder="${t("welcomePh")}" value="${esc(d.welcome || "")}"></div>
        </section>
        <section class="dcard"><h3>${t("offers")}</h3><small>${t("offersS")}</small>
          ${offers.map((o, i) => `<div class="offerbox"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div class="thumb">${o.image ? `<img src="${o.image}" alt="">` : t("none")}</div>
              <span class="btn filebtn" style="padding:6px 10px;font-size:13px">${t("choose")}<input type="file" accept="image/*" data-oimg="${i}"></span></div>
            <div class="fields"><div class="drow" style="justify-content:space-between"><b style="font-size:14px">${t("offer", { n: i + 1 })}</b><button class="btn quiet" data-dact="rmoffer" data-i="${i}">${t("remove")}</button></div>
              <div class="dfield"><label>${t("oTitle")}</label><input data-of="title" data-i="${i}" maxlength="40" placeholder="${t("oTitlePh")}" value="${esc(o.title || "")}"></div>
              <div class="dfield"><label>${t("oText")}</label><input data-of="text" data-i="${i}" maxlength="100" value="${esc(o.text || "")}"></div>
              <div class="dfield"><label>${t("oPrice")}</label><input data-of="price" data-i="${i}" maxlength="20" placeholder="${t("oPricePh")}" value="${esc(o.price || "")}"></div></div></div>`).join("")}
          ${offers.length < 3 ? `<button class="btn" data-dact="addoffer" style="align-self:flex-start">${t("addOffer")}</button>` : ""}
        </section>
        <section class="dcard"><h3>${t("links")}</h3>
          <div class="drow">${[["instagram","text"],["whatsapp","tel"],["menu","url"],["map","url"]].map(([k, ty]) => `<div class="dfield"><label for="dl-${k}">${t(k)}</label><input id="dl-${k}" type="${ty}" dir="ltr" data-link="${k}" maxlength="200" value="${esc(d.links?.[k] || "")}"></div>`).join("")}</div>
        </section>
        <section class="dcard"><h3>${t("thanks")}</h3><div class="dfield"><input id="d-thanks" maxlength="140" placeholder="${t("thanksPh")}" value="${esc(d.thanks || "")}"></div></section>
        <div class="dbar"><button class="btn primary" data-dact="publish" ${busy ? "disabled" : ""}>${t("publish")}</button>
          ${others.length ? `<select class="btn" id="d-copy"><option value="">${t("copyFrom")}…</option>${others.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join("")}</select>` : ""}
          <span class="unsaved" id="d-dirty">${dirty() ? t("unsaved") : ""}</span><p class="msg ${msg === t("saveErr") || msg === t("imgErr") ? "bad" : "good"}" id="d-msg">${esc(msg)}</p></div>
      </div>
      <aside class="preview"><div class="seg">${[["waiting","pWaiting"],["ready","pReady"],["collected","pAfter"]].map(([k, l]) => `<button data-dact="state" data-v="${k}" aria-pressed="${state === k}">${t(l)}</button>`).join("")}</div>
        <div class="phone"><iframe id="pframe" title="Preview" src="o.html?preview=1"></iframe></div></aside>
    </div></div>`;
  frameReady = false;
}
function changed(){ const el = document.getElementById("d-dirty"); if (el) el.textContent = dirty() ? t("unsaved") : ""; msg = ""; const m = document.getElementById("d-msg"); if (m) m.textContent = ""; clearTimeout(changed.tm); changed.tm = setTimeout(sendPreview, 150); }

box.addEventListener("input", e => {
  const el = e.target, d = drafts[branch]; if (!d) return;
  if (el.id === "d-welcome") d.welcome = el.value;
  else if (el.id === "d-thanks") d.thanks = el.value;
  else if (el.id === "d-brand") d.brand = el.value;
  else if (el.dataset.of){ d.offers[+el.dataset.i][el.dataset.of] = el.value; }
  else if (el.dataset.link){ d.links = d.links || {}; d.links[el.dataset.link] = el.value.trim(); }
  else return;
  changed();
});
box.addEventListener("change", async e => {
  const el = e.target, d = drafts[branch]; if (!d) return;
  if (el.id === "d-copy" && el.value){
    if (!drafts[el.value]) await loadBranch(el.value);
    drafts[branch] = JSON.parse(JSON.stringify(drafts[el.value])); msg = t("copied"); render(); return;
  }
  const file = el.files?.[0]; if (!file) return;
  try {
    if (el.dataset.img === "logo") d.logo = await shrink(file, 256, 256, 60000);
    else if (el.dataset.img === "cover") d.cover = await shrink(file, 1000, 520, 200000);
    else if (el.dataset.oimg != null) d.offers[+el.dataset.oimg].image = await shrink(file, 400, 400, 70000);
    msg = "";
  } catch(x){ msg = t("imgErr"); }
  render();
});
document.addEventListener("click", async e => {
  if (e.target.closest("[data-act=lang]")){ setTimeout(render, 0); return; }
  const b = e.target.closest("[data-dact]"); if (!b || !box.contains(b)) return;
  const a = b.dataset.dact, d = drafts[branch];
  if (a === "branch"){ branch = b.dataset.v; msg = ""; if (!drafts[branch]) await loadBranch(branch); render(); return; }
  if (a === "state"){ state = b.dataset.v; box.querySelectorAll("[data-dact=state]").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === state)); sendPreview(); return; }
  if (a === "bg"){ d.bg = b.dataset.v; box.querySelectorAll("[data-dact=bg]").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === d.bg)); changed(); return; }
  if (a === "rmimg"){ delete d[b.dataset.k]; render(); return; }
  if (a === "addoffer"){ d.offers = d.offers || []; if (d.offers.length < 3) d.offers.push({ title: "", text: "", price: "" }); render(); return; }
  if (a === "rmoffer"){ d.offers.splice(+b.dataset.i, 1); render(); return; }
  if (a === "publish"){
    busy = true; render();
    try {
      const data = clean(d);
      await setDoc(doc(db, "venues", branch, "public", "design"), { ...data, updatedAt: serverTimestamp() });
      saved[branch] = JSON.stringify(data); msg = t("published");
    } catch(x){ console.error(x); msg = t("saveErr"); }
    busy = false; render();
  }
});
</script>
