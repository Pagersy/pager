<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>شاشة الزبائن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--brand:#7A2E3A;--bg:#0B1220;--panel:#141E33;--ink:#EEF2F8;--muted:#8C9AB0;--signal:#F2A900;--line:#24304A;
  --f:"Readex Pro",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden}
button,input{font:inherit;color:inherit}
/* login (from shared.js) */
.login{min-height:100%;display:grid;place-items:center;padding:20px}
.login .card{background:#fff;color:#13213A;border-radius:16px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:8px}
.login h1{font-size:20px;margin:0 0 8px}
.login input{border:1px solid #D6DCE4;border-radius:10px;padding:10px 12px;color:#13213A}
.login label{font-size:13px;color:#5A6577}
.login .btn,.btn{border:0;border-radius:10px;padding:11px 14px;background:#0B6E66;color:#fff;font-weight:600;cursor:pointer;margin-top:8px}
.err{color:#B83434;font-size:14px;margin:0}
/* screen */
.screen{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2vw;padding:3vw}
@media (orientation:portrait){.screen{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.left{background:#fff;color:#111;border-radius:2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:3vh 2vw;text-align:center;position:relative;overflow:hidden}
.left .vn{font-weight:600;font-size:clamp(16px,2vw,28px);color:var(--brand);margin-bottom:1vh}
.left .lab{font-size:clamp(16px,1.8vw,26px);color:#555}
.left .no{font-family:var(--mono);font-weight:600;font-size:clamp(48px,8vw,120px);line-height:1;color:var(--brand)}
.left .qr img,.left .qr canvas{display:block;width:min(34vh,30vw)!important;height:auto!important;image-rendering:pixelated}
.left .hint{font-size:clamp(15px,1.7vw,24px);max-width:28ch}
.left .ok{font-size:clamp(28px,4vw,56px);color:#1E7F55;font-weight:700}
.idle .big{font-size:clamp(28px,3.6vw,52px);font-weight:700;color:var(--brand);max-width:16ch;line-height:1.3}
.right{background:var(--panel);border-radius:2vw;padding:3vh 2vw;display:flex;flex-direction:column;min-height:0}
.right h2{margin:0 0 2vh;font-size:clamp(18px,2.2vw,32px);color:var(--muted);font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:1.4vw;align-content:flex-start;overflow:hidden}
.n{font-family:var(--mono);font-weight:600;font-size:clamp(40px,6vw,96px);padding:.3vh 1.6vw;border-radius:1.2vw;background:#1E2A44;line-height:1.15}
.n.hot{background:var(--signal);color:#1D1600;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.none{color:var(--muted);font-size:clamp(16px,1.8vw,26px)}
.fs{position:fixed;bottom:12px;inset-inline-start:12px;background:rgba(255,255,255,.08);border:0;color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion: reduce){.n.hot{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { db, esc, ms, dayKey, customerUrl, drawQR, requireStaff } from "./shared.js";
import { collection, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const root = document.getElementById("root");
let V = null, venueId = null, tickets = [], unsub = null, today = dayKey(), linkedAt = 0, lastLinked = null, qrFor = null;
const SHOW_NEW_FOR = 5 * 60 * 1000;   // a new order's QR stays up for 5 minutes

requireStaff(root, ({ venueId: id, venue }) => {
  venueId = id; V = venue;
  onSnapshot(doc(db, "venues", venueId), s => { if (s.exists()){ V = s.data(); render(); } });
  listen();
});
function listen(){
  if (unsub) unsub(); today = dayKey();
  unsub = onSnapshot(query(collection(db, "venues", venueId, "tickets"), where("day", "==", today)), snap => {
    const prev = new Map(tickets.map(t => [t.id, t.status]));
    tickets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // the order on screen was just scanned: show a check mark for a moment
    for (const t of tickets) if (prev.get(t.id) === "new" && t.status !== "new" && t.id === qrFor){ lastLinked = t; linkedAt = Date.now(); setTimeout(render, 2600); }
    render();
  });
}

function render(){
  if (!V) return;
  document.documentElement.style.setProperty("--brand", V.color || "#7A2E3A");
  const now = Date.now();
  const fresh = tickets.filter(t => t.status === "new" && now - (ms(t.createdAt) || now) < SHOW_NEW_FOR)
    .sort((a,b) => (ms(b.createdAt)||now) - (ms(a.createdAt)||now))[0];
  const ready = tickets.filter(t => t.status === "ready").sort((a,b) => (ms(a.readyAt)||0) - (ms(b.readyAt)||0));
  let left;
  if (lastLinked && now - linkedAt < 2500){
    left = `<div class="left"><div class="vn">${esc(V.name)}</div><div class="no">${esc(lastLinked.no)}</div><div class="ok">✓ تم</div><div class="hint">اقعد وين ما بدك، جوالك رح يرن.</div></div>`;
  } else if (fresh){
    left = `<div class="left"><div class="vn">${esc(V.name)}</div><div class="lab">رقم طلبك</div><div class="no">${esc(fresh.no)}</div>
      <div class="qr" id="qr" data-id="${fresh.id}"></div><div class="hint">امسح الرمز بكاميرا الجوال، ورح يرن جوالك لما يجهز طلبك.</div></div>`;
  } else {
    left = `<div class="left idle"><div class="vn">${esc(V.name)}</div><div class="big">اطلب، امسح الرمز، واقعد مرتاح</div><div class="hint">بعد ما تدفع، يظهر هون رمز لطلبك.</div></div>`;
  }
  const qrEl = document.getElementById("qr");
  const sameQR = fresh && qrEl && qrEl.dataset.id === fresh.id && !(lastLinked && now - linkedAt < 2500);
  if (!sameQR){
    root.innerHTML = `<div class="screen">${left}<div class="right"><h2>جاهز للاستلام · ${esc(V.counter || "الكاونتر")}</h2><div class="nums" id="nums"></div></div></div>
      <button class="fs" id="fs">ملء الشاشة</button>`;
    const q = document.getElementById("qr");
    if (q){ drawQR(q, customerUrl(venueId, fresh.id), 360); qrFor = fresh.id; } else qrFor = null;
  }
  document.getElementById("nums").innerHTML = ready.length
    ? ready.map(t => `<span class="n ${t.seenAt ? "" : "hot"}">${esc(t.no)}</span>`).join("")
    : `<span class="none">لا توجد طلبات جاهزة الآن</span>`;
}
document.addEventListener("click", e => { if (e.target.id === "fs") document.documentElement.requestFullscreen?.().catch(()=>{}); });
let wake = null; const keepAwake = async () => { try { wake = await navigator.wakeLock?.request("screen"); } catch(e){} };
keepAwake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && keepAwake());
setInterval(() => { if (!V) return; if (dayKey() !== today) listen(); else render(); }, 5000);
</script>
</body>
</html>
