<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A2E3A">
<title>طلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap">
<style>
/* Customer page. The order number lives on a tear-off ticket: the one bold element.
   Brand colour comes from the shop; amber is the "ready" signal. */
:root{--brand:#7A2E3A;--paper:#F2F4F7;--card:#FFFFFF;--ink:#142033;--muted:#5B6678;--line:#DAE0E8;
  --amber:#F5A524;--amber-ink:#2E1F00;--good:#1F8A4C;--good-soft:#E1F3E8;--warn-soft:#FFF4DE;--warn-ink:#6B4500;
  --f:"Alexandria","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
.app::before{content:"";position:absolute;inset:0 0 auto;height:230px;background:var(--brand);border-radius:0 0 36px 36px;z-index:-1}
.head{color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.95);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.vn{font-weight:700;font-size:17px;line-height:1.25}
.vs{font-size:13px;opacity:.85}
.lang{margin-inline-start:auto;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;padding:6px 13px;font-size:13px}
.body{flex:1;padding:12px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.cap{text-align:center;color:var(--muted);font-size:14px}
/* the ticket */
.stub{background:var(--card);border-radius:24px;padding:22px 20px 20px;text-align:center;position:relative;box-shadow:0 1px 2px rgba(20,32,51,.06),0 16px 36px -18px rgba(20,32,51,.35);
  -webkit-mask:radial-gradient(circle 13px at 0 72%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 72%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 13px at 0 72%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 72%,#0000 98%,#000) right/51% 100% no-repeat}
.stub .cap{margin:0}
.stub .num{font-size:84px;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;margin:4px 0 14px;overflow-wrap:anywhere}
.stub .tear{border-top:2px dashed var(--line);margin:0 -4px;padding-top:14px;font-size:14px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:8px}
.stub .tear b{color:var(--ink);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:16px;padding:16px;font-weight:700;font-size:16px;background:var(--brand);color:#fff;width:100%;display:block;text-align:center;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.55}
.note{font-size:14px;color:var(--muted);background:var(--card);border-radius:14px;padding:12px 14px}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.ok{background:var(--good-soft);color:var(--good)}
.timer{text-align:center;font-size:14px;color:var(--muted)}
.timer span{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;background:var(--brand);width:30%;border-radius:9px;animation:prog 2.4s ease-in-out infinite alternate}
@keyframes prog{to{width:78%}}
/* ready: the whole screen becomes the pager */
.ready{flex:1;background:var(--amber);color:var(--amber-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 22px calc(28px + env(safe-area-inset-bottom));text-align:center;position:relative;overflow:hidden;min-height:100vh;min-height:100dvh}
.ready.flash::before{content:"";position:absolute;inset:0;background:#fff;animation:flash 1s steps(2,jump-none) infinite;opacity:0}
@keyframes flash{50%{opacity:.55}}
.ready>*{position:relative}
.ready.seen{background:var(--brand);color:#fff}
.ready h1{font-size:30px;font-weight:800;margin:0;line-height:1.25}
.ready .num{font-size:110px;line-height:1;background:rgba(255,255,255,.35);border-radius:28px;padding:14px 30px;min-width:60%}
.ready.seen .num{background:rgba(255,255,255,.14)}
.ready p{margin:0;font-size:17px;font-weight:500}
.ready .btn{background:var(--amber-ink);color:#fff;max-width:360px;padding:18px}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}
.stars button{border:0;background:none;padding:2px;width:52px;height:52px}
.stars svg{width:100%;height:100%}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:90px;resize:vertical;background:#fff;color:var(--ink);margin-top:6px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;font-weight:500;color:var(--ink);text-decoration:none}
.gbtn i{font-style:normal;font-weight:800;color:#4285F4;font-size:19px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.panel{background:var(--card);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.panel h2{font-size:20px;margin:0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 calc(12px + env(safe-area-inset-bottom))}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="center"><div class="spin"></div></div></div>

<script type="module">
import { firebaseConfig, VAPID_KEY, PRODUCT_NAME } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { getFirestore, doc, getDoc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const qs = new URLSearchParams(location.search);
const vId = qs.get("v"), tId = qs.get("t");
const LINK_KEY = "pg-link:" + tId;

const TX = {
  ar:{
    orderNo:"رقم طلبك",
    oneTap:"ضغطة واحدة، ويرن جوالك عندما يجهز طلبك", turnOn:"فعّل التنبيه", turnOnHint:"اضغط «سماح» عندما يسألك الجوال عن الإشعارات، حتى يرن جوالك عندما يجهز طلبك.",
    preparing:"قيد التحضير", waited:"انتظرت",
    pushOk:"✓ التنبيه شغّال. رح يرن جوالك ويهتز عندما يجهز طلبك، حتى لو قفلته.",
    pageWarn:"الإشعارات غير مفعّلة على هذا الجوال. أبقِ هذه الصفحة مفتوحة والشاشة شغالة حتى تسمع النداء.",
    iosWarn:"على الآيفون: أبقِ هذه الصفحة مفتوحة والشاشة شغالة حتى تسمع النداء.",
    deniedHint:"لتفعيل الإشعارات: اضغط على القفل بجانب عنوان الصفحة ← الإشعارات ← سماح، ثم اضغط الزر.", retry:"فعّل الإشعارات",
    walk:"تقدر تقعد وين ما بدك، رح نناديك.",
    ready:"طلبك جاهز!", headTo:"توجّه إلى {c}", onWay:"أنا جاي", showStaff:"اعرض هذا الرقم للموظف",
    tapSound:"اضغط لتسمع النداء",
    rateT:"كيف كانت زيارتك؟", thanks:"شكراً لزيارتك", fbT:"قل للمدير شو صار (رسالة خاصة، لا تُنشر)", send:"أرسل", fbSent:"✓ وصلت رسالتك للمدير. شكراً لك.",
    google:"قيّمنا على Google", rated:"شكراً على تقييمك",
    taken:"هذا الرقم مربوط بجوال آخر.", takenD:"اطلب من الكاشير رقماً جديداً.",
    cancelled:"تم إلغاء هذا الطلب.", notFound:"لم نجد هذا الطلب.", notFoundD:"امسح الرمز مرة ثانية أو اسأل الكاشير.",
    offline:"الاتصال ضعيف. سنحدّث الصفحة تلقائياً عند عودته.", counterDef:"الكاونتر", err:"صار خطأ. جرّب مرة ثانية."
  },
  en:{
    orderNo:"Your order number",
    oneTap:"One tap, and your phone rings when it's ready", turnOn:"Turn on alerts", turnOnHint:"Tap \"Allow\" when your phone asks about notifications, so it rings when your order is ready.",
    preparing:"Being prepared", waited:"Waited",
    pushOk:"✓ Alerts are on. Your phone will ring and vibrate when your order is ready, even if you lock it.",
    pageWarn:"Notifications are off on this phone. Keep this page open and the screen on to hear the call.",
    iosWarn:"On iPhone: keep this page open and the screen on to hear the call.",
    deniedHint:"To turn on notifications: tap the lock next to the page address → Notifications → Allow, then tap the button.", retry:"Turn on notifications",
    walk:"Sit anywhere you like. We'll call you.",
    ready:"Your order is ready!", headTo:"Head to {c}", onWay:"On my way", showStaff:"Show this number to the staff",
    tapSound:"Tap to hear the call",
    rateT:"How was your visit?", thanks:"Thanks for coming", fbT:"Tell the manager what went wrong (private, not posted)", send:"Send", fbSent:"✓ The manager got your message. Thank you.",
    google:"Review us on Google", rated:"Thanks for your rating",
    taken:"This number is linked to another phone.", takenD:"Ask the cashier for a new number.",
    cancelled:"This order was cancelled.", notFound:"We couldn't find this order.", notFoundD:"Scan the code again or ask the cashier.",
    offline:"Weak connection. The page updates on its own when it's back.", counterDef:"the counter", err:"Something went wrong. Try again."
  }
};
let lang = "ar";
try { lang = localStorage.getItem("pg-lang") || "ar"; } catch(e){}
const t = (k, v={}) => { let s = TX[lang][k] ?? k; for (const x in v) s = s.replace("{"+x+"}", v[x]); return s; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms = ts => ts?.toMillis ? ts.toMillis() : null;
const mmss = d => { const s = Math.max(0, Math.floor(d/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const $app = document.getElementById("app");

let venue = null, ticket = null, missing = false;
let busy = false, rated = 0, fb = "", fbSent = false, lastCalls = 0, acked = false;
const mine = () => { try { return localStorage.getItem(LINK_KEY) === "1"; } catch(e){ return true; } };
const setMine = () => { try { localStorage.setItem(LINK_KEY, "1"); } catch(e){} };

/* ---------- phone notifications (Firebase Cloud Messaging) ---------- */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) && !window.MSStream;
let swReg = null;
async function pushToken(){
  try {
    if (!(await isSupported()) || !("Notification" in window) || !("serviceWorker" in navigator)) return null;
    const perm = Notification.permission === "default" ? await Notification.requestPermission() : Notification.permission;
    if (perm !== "granted") return null;
    swReg = swReg || await navigator.serviceWorker.register("./sw.js", { scope: "./" });
    await navigator.serviceWorker.ready;
    return await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg }) || null;
  } catch(e){ console.warn("push", e); return null; }
}

/* ---------- sound, vibration, wake lock ---------- */
let actx = null, ringTimer = null, titleTimer = null, wake = null;
function unlockAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e){}
}
function beep(f, t0, d){ const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.35, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + d + .05); }
function ringOnce(){
  try { if (actx && actx.state === "running"){ const t0 = actx.currentTime; [0,.17,.34,.62,.79,.96].forEach((dt,i)=>beep(i%2?1318:988, t0+dt, .14)); } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([400,150,400,150,400]); } catch(e){}
}
function startRing(){
  stopRing(); ringOnce(); ringTimer = setInterval(ringOnce, 1800); setTimeout(stopRing, 180000);
  const base = document.title; let on = false;
  titleTimer = setInterval(() => { document.title = (on = !on) ? "🔔 " + t("ready") : base; }, 900);
}
function stopRing(){ clearInterval(ringTimer); clearInterval(titleTimer); ringTimer = titleTimer = null; document.title = venue?.name || "طلبك"; try { navigator.vibrate && navigator.vibrate(0); } catch(e){} }
async function keepAwake(){ try { wake = await navigator.wakeLock?.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ticket && ["waiting","ready"].includes(ticket.status)) keepAwake(); });

/* ---------- views ---------- */
const vname = () => (lang === "en" && venue?.nameEn) ? venue.nameEn : (venue?.name || "");
const counter = () => (lang === "en" && venue?.counterEn) ? venue.counterEn : (venue?.counter || t("counterDef"));
function head(sub){
  return `<header class="head"><div class="logo">${esc(venue?.initial || vname().slice(0,1))}</div>
    <div><div class="vn">${esc(vname())}</div><div class="vs">${esc(sub || "")}</div></div>
    <button class="lang" data-act="lang">${lang === "ar" ? "English" : "عربي"}</button></header>`;
}
const foot = () => `<div class="foot">${esc(PRODUCT_NAME)}</div>`;
function msgView(title, sub){ return head("") + `<div class="body"><div class="center"><b style="font-size:19px">${esc(title)}</b><div class="cap">${esc(sub||"")}</div></div></div>`; }

function render(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  if (venue?.color){ document.documentElement.style.setProperty("--brand", venue.color); document.querySelector('meta[name="theme-color"]').content = venue.color; }
  if (!vId || !tId || missing){ $app.innerHTML = msgView(t("notFound"), t("notFoundD")); return; }
  if (!venue || !ticket){ $app.innerHTML = `<div class="center"><div class="spin"></div></div>`; return; }
  const tk = ticket, st = tk.status;
  if (st === "cancelled"){ stopRing(); $app.innerHTML = msgView(t("cancelled"), ""); return; }

  // someone else already linked this number
  if (st !== "new" && !mine() && !tk.collectedAt){ $app.innerHTML = msgView(t("taken"), t("takenD")); return; }

  if (st === "new"){
    $app.innerHTML = head(t("orderNo") + " " + tk.no) + `<div class="body">
      <div class="stub"><div class="cap">${t("orderNo")}</div><div class="num">${esc(tk.no)}</div>
        <div class="tear">${t("oneTap")}</div></div>
      <div class="center" style="flex:0;gap:10px;margin-top:6px">
        <button class="btn" data-act="link" ${busy?"disabled":""}>🔔 ${t("turnOn")}</button>
        <div class="cap">${t("turnOnHint")}</div></div></div>${foot()}`;
    return;
  }

  if (st === "waiting"){
    const since = ms(tk.linkedAt) || Date.now();
    let chNote = "";
    if (tk.channel === "push") chNote = `<div class="note ok">${t("pushOk")}</div>`;
    else if (isIOS) chNote = `<div class="note warn">${t("iosWarn")}</div>`;
    else chNote = `<div class="note warn">${t("pageWarn")}</div>`
      + (("Notification" in window) && Notification.permission === "denied" ? `<div class="cap">${t("deniedHint")}</div>` : "")
      + `<button class="btn alt" data-act="retry">🔔 ${t("retry")}</button>`;
    $app.innerHTML = head(t("orderNo") + " " + tk.no) + `<div class="body">
      <div class="stub"><div class="cap">${t("orderNo")}</div><div class="num">${esc(tk.no)}</div>
        <div class="tear"><span class="dot"></span><b>${t("preparing")}</b> · ${t("waited")} <span class="timer"><span data-since="${since}">0:00</span></span></div></div>
      ${chNote}<div class="note">${t("walk")}</div></div>${foot()}`;
    return;
  }

  if (st === "ready"){
    const seen = !!tk.seenAt || acked;
    const needTap = !seen && (!actx || actx.state !== "running");
    $app.innerHTML = `<div class="ready ${seen ? "seen" : "flash"}">
      <h1>${seen ? t("headTo", {c: esc(counter())}) : t("ready")}</h1>
      <div class="num">${esc(tk.no)}</div>
      <p>${seen ? t("showStaff") : t("headTo", {c: esc(counter())})}</p>
      ${venue.note ? `<p style="opacity:.9">${esc(venue.note)}</p>` : ""}
      ${seen ? "" : `<button class="btn" data-act="ack">${needTap ? t("tapSound") + " · " : ""}${t("onWay")}</button>`}</div>`;
    return;
  }

  if (st === "collected"){
    stopRing();
    const r = tk.rating || rated;
    let inner = "";
    if (!r){
      inner = `<div class="center"><div class="panel"><h2>${t("rateT")}</h2>
        <div class="stars">${[1,2,3,4,5].map(i => `<button data-act="rate" data-v="${i}" aria-label="${i}"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="#D9D7D0"/></svg></button>`).join("")}</div></div></div>`;
    } else {
      const low = r <= 3;
      inner = `<div class="panel"><div class="stars" aria-label="${r}/5">${[1,2,3,4,5].map(i => `<svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="${i<=r?"#F2A900":"#D9D7D0"}"/></svg>`).join("")}</div>
        <div class="cap">${t("rated")}</div>
        ${low ? (fbSent || tk.feedback ? `<div class="note ok">${t("fbSent")}</div>` :
          `<div><b style="font-size:14px">${t("fbT")}</b><textarea id="fb" maxlength="500">${esc(fb)}</textarea></div><button class="btn" data-act="fb">${t("send")}</button>`) : ""}
        ${venue.reviewUrl ? `<a class="gbtn" href="${esc(venue.reviewUrl)}" target="_blank" rel="noopener"><i>G</i>${t("google")}</a>` : ""}</div>`;
    }
    $app.innerHTML = head(t("thanks")) + `<div class="body">${inner}</div>${foot()}`;
    return;
  }
}

/* ---------- actions ---------- */
const tRef = () => doc(db, "venues", vId, "tickets", tId);
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  try {
    if (a === "lang"){ lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("pg-lang", lang); } catch(_){} render(); }
    if (a === "link"){
      unlockAudio(); keepAwake(); setMine(); busy = true; render();
      const token = await pushToken();
      const upd = { status:"waiting", linkedAt: serverTimestamp(), channel: token ? "push" : "page" };
      if (token) upd.pushToken = token;
      await updateDoc(tRef(), upd);
      busy = false; render();
    }
    if (a === "retry"){
      unlockAudio(); keepAwake();
      const token = await pushToken();
      if (token) await updateDoc(tRef(), { channel:"push", pushToken: token });
      else render();
    }
    if (a === "ack"){
      unlockAudio(); stopRing(); acked = true; render();
      if (ticket.status === "ready" && !ticket.seenAt) await updateDoc(tRef(), { seenAt: serverTimestamp() });
    }
    if (a === "rate"){ rated = +b.dataset.v; render(); await updateDoc(tRef(), { rating: rated }); }
    if (a === "fb"){ fb = document.getElementById("fb")?.value.trim() || ""; if (!fb) return; await updateDoc(tRef(), { feedback: fb.slice(0,500) }); fbSent = true; render(); }
  } catch(err){ console.error(err); busy = false; alertBox(t("err")); render(); }
});
document.addEventListener("input", e => { if (e.target.id === "fb") fb = e.target.value; });
function alertBox(text){ const n = document.createElement("div"); n.className = "note warn"; n.style.cssText = "position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9"; n.textContent = text; document.body.appendChild(n); setTimeout(() => n.remove(), 3500); }

/* ---------- live data ---------- */
async function start(){
  if (!vId || !tId){ render(); return; }
  try {
    const vs = await getDoc(doc(db, "venues", vId));
    if (!vs.exists()){ missing = true; render(); return; }
    venue = vs.data(); document.title = venue.name || document.title;
  } catch(e){ missing = true; render(); return; }
  onSnapshot(tRef(), snap => {
    if (!snap.exists()){ missing = true; render(); return; }
    const prev = ticket; ticket = snap.data();
    const calls = ticket.calls || 0;
    // ring on first call and on every "call again"
    if (ticket.status === "ready" && mine() && (!prev || prev.status !== "ready" || calls > lastCalls)){ acked = false; if (!ticket.seenAt || calls > lastCalls) startRing(); }
    if (ticket.status !== "ready") stopRing();
    lastCalls = calls;
    if (ticket.status === "ready" && !prev && ticket.seenAt) acked = true;
    render();
  }, err => { console.error(err); alertBox(t("offline")); });
}
