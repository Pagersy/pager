<style>
body{background:#fff}
.w{max-width:1160px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left))}
a{color:inherit}
/* nav */
.nav{display:flex;align-items:center;gap:18px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;margin-inline-end:auto}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.brand i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px rgba(245,165,36,.25)}
.nav .links{display:flex;gap:22px;font-size:14.5px;color:var(--muted)}
.nav .links a{text-decoration:none}
.nav .links a:hover{color:var(--ink)}
.lang{border:0;background:var(--sunk);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--muted)}
@media (max-width:820px){.nav .links{display:none}}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:40px 72px}
@media (max-width:880px){.hero{grid-template-columns:1fr;gap:36px;padding-block:20px 56px}}
.hero h1{font-size:clamp(34px,5.4vw,62px);line-height:1.12;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero p{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:34em;margin:20px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta .btn{padding:16px 26px;font-size:16px;border-radius:14px}
.cta small{color:var(--muted);font-size:13.5px;width:100%}
/* phone mock: the product's ringing screen */
.mock{justify-self:center;width:min(300px,78vw);aspect-ratio:300/600;background:var(--ink);border-radius:46px;padding:12px;box-shadow:0 30px 60px -28px rgba(20,32,51,.55);transform:rotate(-3deg);animation:buzz 2.6s ease-in-out infinite}
@keyframes buzz{0%,70%,100%{transform:rotate(-3deg)}74%{transform:rotate(-1.5deg) translateX(-3px)}78%{transform:rotate(-4.5deg) translateX(3px)}82%{transform:rotate(-1.5deg) translateX(-3px)}86%{transform:rotate(-4deg) translateX(2px)}}
.mock .scr{height:100%;border-radius:35px;background:var(--amber);color:var(--amber-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.mock .scr b{font-size:24px;font-weight:800}
.mock .scr .n{font-size:84px;font-weight:800;line-height:1;background:rgba(255,255,255,.4);border-radius:24px;padding:10px 26px;font-variant-numeric:tabular-nums}
.mock .scr span{font-size:15px;font-weight:500}
.mock .scr em{font-style:normal;background:var(--amber-ink);color:#fff;border-radius:14px;padding:12px 26px;font-weight:700;font-size:15px}
/* sections */
section.band{padding-block:72px}
section.band.alt{background:var(--paper)}
.band h2{font-size:clamp(26px,3.2vw,38px);font-weight:800;margin:0 0 10px;text-wrap:balance}
.band .lead{color:var(--muted);font-size:17px;max-width:40em;margin:0 0 36px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{background:var(--paper);border-radius:var(--r-lg);padding:24px}
.band.alt .step{background:#fff}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;margin-bottom:16px}
.step h3{font-size:18px;margin:0 0 6px}
.step p{margin:0;color:var(--muted)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.compare{grid-template-columns:1fr}}
.col{border-radius:var(--r-lg);padding:26px}
.col.old{background:#fff;border:1px solid var(--line)}
.col.new{background:var(--ink);color:#fff}
.col h3{margin:0 0 16px;font-size:19px}
.col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.col li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.col.old li::before{content:"✕";color:var(--bad);font-weight:700}
.col.new li::before{content:"✓";color:var(--amber);font-weight:700}
.col.new li span{color:#C9D2E0}
.tree{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:820px){.tree{grid-template-columns:1fr}}
.org{background:var(--paper);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.org .acc{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.org .acc small{font-weight:400;color:#C9D2E0}
.org .br{background:#fff;border-radius:var(--r);padding:12px 16px;margin-inline-start:28px;display:flex;justify-content:space-between;gap:10px;position:relative}
.org .br::before{content:"";position:absolute;inset-inline-start:-16px;top:50%;width:12px;border-top:2px solid var(--line)}
.org .br small{color:var(--muted)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
.feat li b{display:block;font-size:16px}
.feat li span{color:var(--muted)}
.price{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:820px){.price{grid-template-columns:1fr}}
.plan{background:#fff;border-radius:var(--r-lg);padding:28px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.plan.main{border:2px solid var(--teal)}
.plan h3{margin:0;font-size:18px}
.plan .big{font-size:40px;font-weight:800;line-height:1.1}
.plan .big small{font-size:15px;font-weight:500;color:var(--muted)}
.plan ul{margin:6px 0 0;padding-inline-start:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.plan .btn{margin-top:auto;padding:14px}
.faq{display:flex;flex-direction:column;gap:10px;max-width:760px}
.faq details{background:var(--paper);border-radius:var(--r);padding:16px 20px}
.faq summary{font-weight:700;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:10px 0 0;color:var(--muted)}
.final{background:var(--ink);color:#fff;border-radius:28px;padding:48px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.final h2{margin:0;font-size:clamp(26px,3.4vw,40px)}
.final p{margin:0;color:#C9D2E0}
footer{padding-block:32px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
</style>
</head>

let lang = "ar";
try { lang = localStorage.getItem("pg-staff-lang") || ((navigator.language||"").startsWith("en") ? "en" : "ar"); } catch(e){}
function apply(){
  const d = TX[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (d[k] != null) el.textContent = d[k]; });
  document.getElementById("lang").textContent = d.lang;
  document.getElementById("price").innerHTML = PRICE_PER_BRANCH ? `${PRICE_PER_BRANCH} <small>${d.p2s}</small>` : d.p2pNone;
  const wa = SUPPORT_WHATSAPP ? "https://wa.me/" + SUPPORT_WHATSAPP.replace(/[^0-9]/g, "") : "";
  const c = document.getElementById("contact"); if (wa){ c.href = wa; } else { c.href = "signup.html"; c.textContent = d.start; c.removeAttribute("target"); }
  const f = document.getElementById("wa"); if (wa){ f.href = wa; f.hidden = false; }
  document.title = (lang === "ar" ? d.name + " · " + TX.en.name : TX.en.name + " · " + TX.ar.name);
}
document.getElementById("lang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("pg-staff-lang", lang); } catch(e){} apply(); });
apply();
</script>
