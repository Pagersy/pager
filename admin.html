<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<meta name="robots" content="noindex">
<title>Admin · الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
.wrap{max-width:1320px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:env(safe-area-inset-top)}
.bar h1{font-size:20px;margin:0 auto 0 0;display:flex;align-items:center;gap:10px}
[dir=rtl] .bar h1{margin:0 0 0 auto}
.bar h1 i{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.bar h1 i::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--amber)}
/* summary: the money and the problems first */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.tile{background:var(--card);border-radius:var(--r);padding:14px 16px;border:0;text-align:start;display:flex;flex-direction:column;gap:2px}
button.tile{cursor:pointer}
button.tile:hover{box-shadow:0 0 0 2px var(--line)}
button.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile.warn b{color:#B45309}
.tile.bad b{color:var(--bad)}
.tile.money{background:var(--ink);color:#fff}
.tile.money span{color:#C9D2E0}
.tile.money b{font-size:22px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 10px}
.tools input{flex:1 1 260px;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;background:var(--card)}
.tools small{color:var(--muted)}
/* table */
.tablewrap{background:var(--card);border-radius:var(--r-lg);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
td .nm{font-weight:700}
td .sub{color:var(--muted);font-size:12.5px;direction:ltr;text-align:start}
[dir=rtl] td .sub{text-align:right}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.trial{background:var(--teal-soft);color:var(--teal)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.grace{background:var(--bad);color:#fff}
.pill.blocked{background:var(--ink);color:#fff}
.pill.suspended{background:#E5E7EB;color:#374151}
.days{font-variant-numeric:tabular-nums}
.days.soon{color:#B45309;font-weight:700}
.days.late{color:var(--bad);font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
a.wa{color:#128C7E;text-decoration:none;font-weight:500;direction:ltr;display:inline-block}
/* account sheet */
.ov{position:fixed;inset:0;background:rgba(14,22,36,.5);z-index:20;display:flex;justify-content:flex-end}
[dir=rtl] .ov{justify-content:flex-start}
.panel{background:var(--paper);width:min(560px,100%);height:100%;overflow-y:auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:14px}
.panel header{display:flex;gap:10px;align-items:flex-start}
.panel header h2{margin:0;font-size:22px;flex:1}
.box{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:14.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.f{display:flex;flex-direction:column;gap:5px;flex:1 1 120px}
.f label{font-size:12.5px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--sunk);width:100%;font:inherit}
.f textarea{min-height:70px;resize:vertical}
.preview{font-size:14px;background:var(--good-soft);color:#14532D;border-radius:var(--r-sm);padding:10px 12px}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list div:first-child{border-top:0}
.list small{color:var(--muted)}
.msg{font-size:13px;margin:0;color:var(--good);min-height:1em}
.danger{color:var(--bad)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { PRODUCT_NAME } from "./config.js";
import { auth, db, esc, ms, dayKey, getLang, setLang, makeT, applyDir, accountState, loginView, logout, showFatal } from "./shared.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, getDoc, getDocs, query, where, onSnapshot, updateDoc, addDoc, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TX = {
  ar: {
    title:"لوحة الإدارة", lang:"English", out:"خروج", notAdmin:"هذا الحساب ليس حساب إدارة.", notAdminD:"أضف المستند admins/{uid} في Firestore (راجع SETUP.md).",
    tAll:"كل الحسابات", tTrial:"في التجربة", tPaid:"مدفوع", tSoon:"تنتهي خلال 7 أيام", tGrace:"يجب أن يدفع الآن", tStop:"متوقف", tSusp:"موقوف يدوياً", tMonth:"المحصّل هذا الشهر",
    search:"ابحث بالاسم أو البريد أو الرقم", shown:"{n} حساب",
    cName:"المطعم", cWa:"واتساب", cBr:"الفروع", cStatus:"الحالة", cEnds:"ينتهي", cCreated:"تاريخ التسجيل", cLast:"آخر دفعة",
    sTrial:"تجربة", sPaid:"مدفوع", sGrace:"مهلة الدفع", sBlocked:"متوقف", sSuspended:"موقوف", sNone:"—",
    dLeft:"بعد {n} يوم", dToday:"اليوم", dAgo:"منذ {n} يوم", none:"لا توجد حسابات بهذا الفلتر.",
    info:"معلومات الحساب", owner:"بريد المالك", phone:"واتساب", created:"التسجيل", id:"معرّف الحساب", ends:"ينتهي في", status:"الحالة", note:"ملاحظة",
    chat:"راسل على واتساب", chatMsg:"مرحباً، معك فريق {p} بخصوص حساب {r}.",
    pay:"تسجيل دفعة", months:"المدة", m1:"شهر", m3:"3 أشهر", m6:"6 أشهر", m12:"سنة", amount:"المبلغ", currency:"العملة", method:"طريقة الدفع",
    cash:"نقداً", transfer:"تحويل", other:"أخرى", payNote:"ملاحظة (اختياري)", newEnd:"سيصبح مدفوعاً حتى {d}.", savePay:"تسجيل الدفعة وتشغيل الخدمة", paid:"تم تسجيل الدفعة. الحساب مدفوع حتى {d}.",
    trialX:"تمديد التجربة", add7:"+7 أيام", add14:"+14 يوماً", extended:"تم التمديد حتى {d}.",
    limit:"عدد الفروع المسموح", saveLimit:"حفظ", limitSaved:"تم الحفظ.",
    susp:"إيقاف الحساب", suspD:"يوقف الطلبات الجديدة في كل الفروع فوراً، بغض النظر عن الدفع.", doSusp:"إيقاف الحساب", doResume:"إعادة تشغيل الحساب", sureSusp:"اضغط مرة ثانية للتأكيد",
    suspOn:"الحساب موقوف.", suspOff:"تمت إعادة التشغيل.",
    adminNote:"ملاحظات داخلية", saveNote:"حفظ الملاحظة", noteSaved:"تم الحفظ.",
    branches:"الفروع", ordersToday:"{n} طلب اليوم", staffN:"{n} حساب موظف",
    history:"سجل الدفعات", noHistory:"لا توجد دفعات بعد.", close:"إغلاق", err:"تعذّر الحفظ. تأكد من الاتصال والصلاحيات."
  },
  en: {
    title:"Admin", lang:"عربي", out:"Sign out", notAdmin:"This login isn't an admin.", notAdminD:"Add the document admins/{uid} in Firestore (see SETUP.md).",
    tAll:"All accounts", tTrial:"In trial", tPaid:"Paid", tSoon:"Ending within 7 days", tGrace:"Must pay now", tStop:"Stopped", tSusp:"Paused by you", tMonth:"Collected this month",
    search:"Search by name, email or number", shown:"{n} accounts",
    cName:"Restaurant", cWa:"WhatsApp", cBr:"Branches", cStatus:"Status", cEnds:"Ends", cCreated:"Signed up", cLast:"Last payment",
    sTrial:"Trial", sPaid:"Paid", sGrace:"Grace period", sBlocked:"Stopped", sSuspended:"Paused", sNone:"—",
    dLeft:"in {n} days", dToday:"today", dAgo:"{n} days ago", none:"No accounts match this filter.",
    info:"Account", owner:"Owner email", phone:"WhatsApp", created:"Signed up", id:"Account ID", ends:"Ends on", status:"Status", note:"Note",
    chat:"Message on WhatsApp", chatMsg:"Hello, this is the {p} team about the {r} account.",
    pay:"Record a payment", months:"Period", m1:"1 month", m3:"3 months", m6:"6 months", m12:"1 year", amount:"Amount", currency:"Currency", method:"Method",
    cash:"Cash", transfer:"Transfer", other:"Other", payNote:"Note (optional)", newEnd:"It will be paid until {d}.", savePay:"Record payment and switch on", paid:"Payment recorded. Paid until {d}.",
    trialX:"Extend the trial", add7:"+7 days", add14:"+14 days", extended:"Extended to {d}.",
    limit:"Branches allowed", saveLimit:"Save", limitSaved:"Saved.",
    susp:"Pause the account", suspD:"Stops new orders in every branch right away, whatever the payment status.", doSusp:"Pause account", doResume:"Switch account back on", sureSusp:"Tap again to confirm",
    suspOn:"Account paused.", suspOff:"Account switched back on.",
    adminNote:"Internal notes", saveNote:"Save note", noteSaved:"Saved.",
    branches:"Branches", ordersToday:"{n} orders today", staffN:"{n} staff logins",
    history:"Payment history", noHistory:"No payments yet.", close:"Close", err:"Couldn't save. Check the connection and permissions."
  }
};
const t = makeT(TX);
const root = document.getElementById("root");
const DAY = 86400000;
let accounts = [], payments = [], filter = "all", search = "", openId = null, detail = {}, form = { months: 1, currency: "USD", method: "cash" }, msg = {}, confirmSusp = false;
window.addEventListener("unhandledrejection", e => showFatal(root, e.reason));

onAuthStateChanged(auth, async user => {
  applyDir();
  if (!user){ loginView(root); return; }
  try {
    const a = await getDoc(doc(db, "admins", user.uid));
    if (!a.exists()){ root.innerHTML = `<div class="auth"><div class="auth-card"><h1>${t("notAdmin")}</h1><p>${t("notAdminD", { uid: esc(user.uid) })}</p><button class="btn" id="lo">${t("out")}</button></div></div>`; return; }
  } catch(e){ showFatal(root, e); return; }
  onSnapshot(collection(db, "accounts"), s => { accounts = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => showFatal(root, e));
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  onSnapshot(collection(db, "payments"), s => { payments = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => showFatal(root, e));
  render();
});

const fmt = m => m ? new Date(m).toLocaleDateString(getLang() === "ar" ? "ar-SY" : "en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
const daysTxt = m => { if (!m) return ""; const d = Math.round((m - Date.now()) / DAY); return d > 0 ? t("dLeft", { n: d }) : d === 0 ? t("dToday") : t("dAgo", { n: -d }); };
const stName = s => ({ trial: t("sTrial"), paid: t("sPaid"), grace: t("sGrace"), blocked: t("sBlocked"), suspended: t("sSuspended") }[s] || t("sNone"));
const waLink = (phone, text) => phone ? "https://wa.me/" + String(phone).replace(/[^0-9]/g, "") + (text ? "?text=" + encodeURIComponent(text) : "") : "";
const lastPay = id => payments.filter(p => p.accountId === id).sort((a,b) => (ms(b.at)||0) - (ms(a.at)||0))[0];

function enriched(){
  return accounts.map(a => { const st = accountState(a); return { ...a, st: st.state, end: ms(a.activeUntil), soon: ["trial","paid"].includes(st.state) && st.daysLeft <= 7 }; });
}
function matches(a){
  if (filter === "trial" && a.st !== "trial") return false;
  if (filter === "paid" && a.st !== "paid") return false;
  if (filter === "soon" && !a.soon) return false;
  if (filter === "grace" && a.st !== "grace") return false;
  if (filter === "blocked" && a.st !== "blocked") return false;
  if (filter === "suspended" && a.st !== "suspended") return false;
  if (search){ const q = search.toLowerCase(); if (![a.name, a.ownerEmail, a.phone, a.id].some(x => String(x || "").toLowerCase().includes(q))) return false; }
  return true;
}

function render(){
  const keepSearch = document.getElementById("q") === document.activeElement;
  // keep what's typed in the account panel when live updates redraw the page
  if (openId) readForm();
  const keepLim = document.getElementById("p-lim")?.value, keepNote = document.getElementById("p-anote")?.value, keepFor = openId;
  const all = enriched();
  const count = f => all.filter(f).length;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const month = {}; payments.filter(p => (ms(p.at) || 0) >= monthStart.getTime()).forEach(p => month[p.currency] = (month[p.currency] || 0) + Number(p.amount || 0));
  const monthTxt = Object.keys(month).length ? Object.entries(month).map(([c, v]) => `${v.toLocaleString()} ${esc(c)}`).join(" · ") : "0";
  // problems first: grace, then stopped, then ending soon, then the rest by end date
  const rank = a => a.st === "grace" ? 0 : a.st === "blocked" ? 1 : a.soon ? 2 : a.st === "suspended" ? 4 : 3;
  const rows = all.filter(matches).sort((a,b) => rank(a) - rank(b) || (a.end||0) - (b.end||0));
  const tile = (key, label, n, cls = "") => `<button class="tile ${cls}" data-act="filter" data-v="${key}" aria-pressed="${filter === key}"><span>${label}</span><b>${n}</b></button>`;

  root.innerHTML = `<div class="wrap">
    <header class="bar"><h1><i></i>${t("title")}</h1><button class="btn quiet" data-act="lang">${t("lang")}</button><button class="btn quiet" data-act="logout">${t("out")}</button></header>
    <div class="sum">
      ${tile("all", t("tAll"), all.length)}${tile("trial", t("tTrial"), count(a => a.st === "trial"))}${tile("paid", t("tPaid"), count(a => a.st === "paid"))}
      ${tile("soon", t("tSoon"), count(a => a.soon), "warn")}${tile("grace", t("tGrace"), count(a => a.st === "grace"), "bad")}${tile("blocked", t("tStop"), count(a => a.st === "blocked"), "bad")}
      ${tile("suspended", t("tSusp"), count(a => a.st === "suspended"))}
      <div class="tile money"><span>${t("tMonth")}</span><b>${monthTxt}</b></div>
    </div>
    <div class="tools"><input id="q" type="search" placeholder="${t("search")}" value="${esc(search)}"><small>${t("shown", { n: rows.length })}</small></div>
    <div class="tablewrap"><table><thead><tr><th>${t("cName")}</th><th>${t("cWa")}</th><th>${t("cBr")}</th><th>${t("cStatus")}</th><th>${t("cEnds")}</th><th>${t("cLast")}</th><th>${t("cCreated")}</th></tr></thead>
      <tbody>${rows.length ? rows.map(a => { const lp = lastPay(a.id), d = a.end ? Math.round((a.end - Date.now()) / DAY) : null;
        return `<tr data-act="open" data-id="${a.id}"><td><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.ownerEmail || "")}</div></td>
        <td>${a.phone ? `<a class="wa" href="${waLink(a.phone)}" target="_blank" rel="noopener" data-stop="1">${esc(a.phone)}</a>` : "—"}</td>
        <td class="num">${Object.keys(a.branches || {}).length} / ${a.maxBranches || 3}</td>
        <td><span class="pill ${a.st}">${stName(a.st)}</span></td>
        <td><div>${fmt(a.end)}</div><div class="days ${d !== null && d < 0 ? "late" : a.soon ? "soon" : ""}" style="font-size:12.5px">${daysTxt(a.end)}</div></td>
        <td>${lp ? `${Number(lp.amount).toLocaleString()} ${esc(lp.currency)}<div class="sub">${fmt(ms(lp.at))}</div>` : "—"}</td>
        <td>${fmt(ms(a.createdAt))}</td></tr>`; }).join("") : `<tr><td colspan="7" class="empty">${t("none")}</td></tr>`}</tbody></table></div>
  </div>${openId ? sheet() : ""}`;
  if (keepFor && keepFor === openId){ const l = document.getElementById("p-lim"), n = document.getElementById("p-anote"); if (l && keepLim != null && !msg.limit) l.value = keepLim; if (n && keepNote != null && !msg.note) n.value = keepNote; }
  if (keepSearch){ const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

function sheet(){
  const a = enriched().find(x => x.id === openId); if (!a) return "";
  const st = accountState(a), d = detail[a.id] || {};
  const base = Math.max(Date.now(), a.end || 0), newEnd = base + form.months * 30 * DAY;
  const hist = payments.filter(p => p.accountId === a.id).sort((x,y) => (ms(y.at)||0) - (ms(x.at)||0));
  const staffN = Object.keys(a.staff || {}).length;
  return `<div class="ov" data-act="close-bg"><aside class="panel" role="dialog" aria-label="${esc(a.name)}">
    <header><h2>${esc(a.name)}</h2><span class="pill ${a.st}">${stName(a.st)}</span><button class="btn quiet" data-act="close">${t("close")}</button></header>
    <section class="box"><h3>${t("info")}</h3><div class="kv">
      <span>${t("owner")}</span><b dir="ltr">${esc(a.ownerEmail || "—")}</b>
      <span>${t("phone")}</span><b dir="ltr">${esc(a.phone || "—")}</b>
      <span>${t("ends")}</span><b>${fmt(a.end)} · ${daysTxt(a.end)}</b>
      <span>${t("created")}</span><b>${fmt(ms(a.createdAt))}</b>
      <span>${t("id")}</span><b dir="ltr" style="font-size:12.5px">${esc(a.id)}</b></div>
      ${a.phone ? `<div class="row"><a class="btn" href="${waLink(a.phone, t("chatMsg", { p: PRODUCT_NAME || "Dorak", r: a.name }))}" target="_blank" rel="noopener">${t("chat")}</a></div>` : ""}</section>

    <section class="box"><h3>${t("pay")}</h3>
      <div class="seg" role="group" aria-label="${t("months")}">${[[1,"m1"],[3,"m3"],[6,"m6"],[12,"m12"]].map(([m,k]) => `<button data-act="months" data-v="${m}" aria-pressed="${form.months === m}">${t(k)}</button>`).join("")}</div>
      <div class="row">
        <div class="f"><label for="p-amt">${t("amount")}</label><input id="p-amt" type="number" min="0" step="any" inputmode="decimal" value="${esc(form.amount ?? "")}"></div>
        <div class="f"><label for="p-cur">${t("currency")}</label><select id="p-cur"><option ${form.currency === "USD" ? "selected" : ""}>USD</option><option ${form.currency === "SYP" ? "selected" : ""}>SYP</option></select></div>
        <div class="f"><label for="p-met">${t("method")}</label><select id="p-met">${["cash","transfer","other"].map(m => `<option value="${m}" ${form.method === m ? "selected" : ""}>${t(m)}</option>`).join("")}</select></div>
      </div>
      <div class="f"><label for="p-note">${t("payNote")}</label><input id="p-note" value="${esc(form.note ?? "")}"></div>
      <div class="preview">${t("newEnd", { d: fmt(newEnd) })}</div>
      <button class="btn primary" data-act="pay">${t("savePay")}</button><p class="msg">${esc(msg.pay || "")}</p></section>

    ${st.state === "trial" ? `<section class="box"><h3>${t("trialX")}</h3><div class="row"><button class="btn" data-act="ext" data-v="7">${t("add7")}</button><button class="btn" data-act="ext" data-v="14">${t("add14")}</button></div><p class="msg">${esc(msg.ext || "")}</p></section>` : ""}

    <section class="box"><h3>${t("branches")}</h3><div class="list">${Object.entries(a.branches || {}).map(([id, n]) => `<div><span>${esc(n)}</span><small>${d.today ? t("ordersToday", { n: d.today[id] ?? 0 }) : "…"}</small></div>`).join("")}</div>
      <small style="color:var(--muted)">${t("staffN", { n: staffN })}</small>
      <div class="row"><div class="f" style="flex:0 1 140px"><label for="p-lim">${t("limit")}</label><input id="p-lim" type="number" min="1" max="100" value="${a.maxBranches || 3}"></div><button class="btn" data-act="limit" style="align-self:flex-end">${t("saveLimit")}</button></div>
      <p class="msg">${esc(msg.limit || "")}</p></section>

    <section class="box"><h3>${t("adminNote")}</h3><div class="f"><textarea id="p-anote">${esc(a.adminNote || "")}</textarea></div><button class="btn" data-act="note">${t("saveNote")}</button><p class="msg">${esc(msg.note || "")}</p></section>

    <section class="box"><h3>${t("history")}</h3><div class="list">${hist.length ? hist.map(p => `<div><span>${Number(p.amount).toLocaleString()} ${esc(p.currency)} · ${t(p.method || "other")} · ${p.months} ${getLang() === "ar" ? "شهر" : "mo"}</span><small>${fmt(ms(p.at))}${p.note ? " · " + esc(p.note) : ""}</small></div>`).join("") : `<small style="color:var(--muted)">${t("noHistory")}</small>`}</div></section>

    <section class="box"><h3 class="danger">${t("susp")}</h3><small style="color:var(--muted)">${t("suspD")}</small>
      <div class="row">${a.suspended ? `<button class="btn primary" data-act="resume">${t("doResume")}</button>` : `<button class="btn ${confirmSusp ? "primary" : ""}" data-act="suspend" style="${confirmSusp ? "background:var(--bad);border-color:var(--bad)" : "color:var(--bad)"}">${confirmSusp ? t("sureSusp") : t("doSusp")}</button>`}</div>
      <p class="msg">${esc(msg.susp || "")}</p></section>
  </aside></div>`;
}

async function loadToday(a){
  const day = dayKey(), today = {};
  await Promise.all(Object.keys(a.branches || {}).map(async id => {
    try { const s = await getDocs(query(collection(db, "venues", id, "tickets"), where("day", "==", day))); today[id] = s.docs.filter(x => x.data().status !== "cancelled").length; } catch(e){ today[id] = "?"; }
  }));
  detail[a.id] = { today }; render();
}
function readForm(){
  const g = id => document.getElementById(id);
  if (g("p-amt")) form.amount = g("p-amt").value;
  if (g("p-cur")) form.currency = g("p-cur").value;
  if (g("p-met")) form.method = g("p-met").value;
  if (g("p-note")) form.note = g("p-note").value;
}

document.addEventListener("input", e => { if (e.target.id === "q"){ search = e.target.value; render(); } });
document.addEventListener("click", async e => {
  if (e.target.id === "lo"){ logout(); return; }
  if (e.target.closest("[data-stop]")) return;
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close-bg" && e.target !== b) return;
  const a = accounts.find(x => x.id === openId);
  const ref = openId ? doc(db, "accounts", openId) : null;
  try {
    switch (act){
      case "lang": setLang(getLang() === "ar" ? "en" : "ar"); render(); break;
      case "logout": logout(); break;
      case "filter": filter = filter === b.dataset.v ? "all" : b.dataset.v; render(); break;
      case "open": openId = null; openId = b.dataset.id; msg = {}; confirmSusp = false; form = { months: 1, currency: form.currency, method: "cash" }; render(); loadToday(accounts.find(x => x.id === openId)); break;
      case "close": case "close-bg": openId = null; render(); break;
      case "months": readForm(); form.months = Number(b.dataset.v); render(); break;
      case "pay": {
        readForm();
        const base = Math.max(Date.now(), ms(a.activeUntil) || 0), end = base + form.months * 30 * DAY;
        await addDoc(collection(db, "payments"), { accountId: a.id, accountName: a.name, amount: Number(form.amount || 0), currency: form.currency, months: form.months,
          method: form.method, note: (form.note || "").trim().slice(0, 200), at: serverTimestamp(), periodEnd: Timestamp.fromMillis(end) });
        await updateDoc(ref, { plan: "paid", activeUntil: Timestamp.fromMillis(end), suspended: false, lastPaymentAt: serverTimestamp() });
        form = { months: 1, currency: form.currency, method: "cash" }; msg.pay = t("paid", { d: fmt(end) }); render(); break;
      }
      case "ext": {
        const end = Math.max(Date.now(), ms(a.activeUntil) || 0) + Number(b.dataset.v) * DAY;
        await updateDoc(ref, { activeUntil: Timestamp.fromMillis(end) }); msg.ext = t("extended", { d: fmt(end) }); render(); break;
      }
      case "limit": { readForm(); const n = Math.max(1, Math.min(100, parseInt(document.getElementById("p-lim").value, 10) || 1)); await updateDoc(ref, { maxBranches: n }); msg.limit = t("limitSaved"); render(); break; }
      case "note": { readForm(); await updateDoc(ref, { adminNote: document.getElementById("p-anote").value.slice(0, 2000) }); msg.note = t("noteSaved"); render(); break; }
      case "suspend": readForm(); if (!confirmSusp){ confirmSusp = true; render(); break; } confirmSusp = false; await updateDoc(ref, { suspended: true }); msg.susp = t("suspOn"); render(); break;
      case "resume": await updateDoc(ref, { suspended: false }); msg.susp = t("suspOff"); render(); break;
    }
  } catch(err){ console.error(err); msg[{ pay:"pay", ext:"ext", limit:"limit", note:"note", suspend:"susp", resume:"susp" }[act] || "pay"] = t("err"); render(); }
});
</script>
</body>
</html>
