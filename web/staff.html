<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213A">
<title>شاشة الموظف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#ECEFF3;--card:#fff;--soft:#F5F7FA;--ink:#13213A;--muted:#5A6577;--line:#D6DCE4;--accent:#0B6E66;--accent-soft:#DCEFEC;
  --signal:#F2A900;--signal-soft:#FFF1CC;--good:#1E7F55;--good-soft:#DDF2E7;--bad:#B83434;--bad-soft:#F8E0E0;
  --f:"Readex Pro",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#1D1600;font-weight:600}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.btn.big{padding:16px 22px;font-size:18px;font-weight:600;border-radius:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:20px}
.login .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:8px}
.login h1{font-size:20px;margin:0 0 8px}
.login input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.login label{font-size:13px;color:var(--muted);margin-top:4px}
.login .btn{margin-top:10px}
.err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top)}
.top h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
.net{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block}
.net.off{background:var(--bad)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--mono);color:var(--ink);font-size:16px;margin-inline-start:4px}
.neworder{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.neworder input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);font-size:16px}
.neworder input.num::placeholder{font-family:var(--f);font-size:15px}
.neworder input.num{flex:0 1 150px;font-family:var(--mono);font-size:20px;text-align:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.col h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col h2 span{font-family:var(--mono);color:var(--muted)}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.no{font-family:var(--mono);font-weight:600;font-size:28px;text-align:center;background:var(--soft);border-radius:10px;padding:4px 0;overflow-wrap:anywhere}
.ready .no{background:var(--signal-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.notefld{font-weight:500;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.p-new{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.p-tg{background:#E1F3FC;color:#0F6E9E}
.p-pg{background:var(--accent-soft);color:var(--accent)}
.p-seen{background:var(--good-soft);color:var(--good)}
.p-miss{background:var(--bad-soft);color:var(--bad)}
.p-wait{background:var(--signal-soft);color:#8A5A00}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.done .row{opacity:.7}
@media (max-width:520px){.row{grid-template-columns:62px minmax(0,1fr)}.row .acts{grid-column:1/-1;justify-content:flex-start}}
.fb{margin-top:14px}
.fb .item{padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.fb .item:first-of-type{border-top:0}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,16,28,.6);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--card);border-radius:20px;padding:22px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sheet .bigno{font-family:var(--mono);font-weight:600;font-size:64px;line-height:1}
.qr{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)}
.qr img,.qr canvas{display:block}
.linked{color:var(--good);font-weight:600;font-size:18px}
.form{align-items:stretch;text-align:start}
.form label{font-size:13px;font-weight:600}
.form input,.form select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);width:100%}
.form .hint{font-size:12.5px;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { db, esc, ms, mmss, dayKey, customerUrl, drawQR, requireStaff, logout } from "./shared.js";
import { collection, doc, query, where, onSnapshot, addDoc, updateDoc, runTransaction, serverTimestamp, increment }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const root = document.getElementById("root");
let V = null, venueId = null, tickets = [], role = "both", showQR = null, settingsOpen = false, today = dayKey(), unsub = null, creating = false;
try { role = localStorage.getItem("pg-role") || "both"; } catch(e){}
const NOT_SEEN_MS = 60000;

requireStaff(root, ({ venueId: id, venue }) => {
  venueId = id; V = venue;
  onSnapshot(doc(db, "venues", venueId), s => { if (s.exists()){ V = s.data(); if (!settingsOpen) render(); } });
  listen();
});

function listen(){
  if (unsub) unsub();
  today = dayKey();
  const q = query(collection(db, "venues", venueId, "tickets"), where("day", "==", today));
  unsub = onSnapshot(q, { includeMetadataChanges: true }, snap => {
    tickets = snap.docs.map(d => ({ id: d.id, ...d.data(), _pending: d.metadata.hasPendingWrites }));
    online = !snap.metadata.fromCache;
    if (showQR){ const tk = tickets.find(x => x.id === showQR); if (tk && tk.status !== "new"){ linkedFlash(tk); } }
    if (!settingsOpen) render();
  });
}
let online = true;
window.addEventListener("online", () => { online = true; render(); });
window.addEventListener("offline", () => { online = false; render(); });

const created = tk => ms(tk.createdAt) || Date.now();
const byCreated = (a, b) => created(a) - created(b);

function render(){
  if (!V) return;
  // keep what the cashier is typing when live updates redraw the screen
  const keep = { nno: document.getElementById("nno")?.value, nnote: document.getElementById("nnote")?.value, focus: document.activeElement?.id };
  const waiting = tickets.filter(t => t.status === "new" || t.status === "waiting").sort(byCreated);
  const ready = tickets.filter(t => t.status === "ready").sort((a,b) => (ms(a.readyAt)||0) - (ms(b.readyAt)||0));
  const done = tickets.filter(t => t.status === "collected").sort((a,b) => (ms(b.collectedAt)||0) - (ms(a.collectedAt)||0));
  const showNew = role !== "bar", showLists = role !== "cashier";
  const manual = V.numberMode === "manual";

  const waits = done.map(t => (ms(t.readyAt)||0) - (ms(t.linkedAt) || created(t))).filter(x => x > 0);
  const rated = done.filter(t => t.rating);
  const fbs = tickets.filter(t => t.feedback).sort((a,b) => created(b) - created(a));

  root.innerHTML = `<div class="wrap">
    <header class="top">
      <h1><span class="net ${online ? "" : "off"}" title="${online ? "متصل" : "غير متصل، سيتم الحفظ لاحقاً"}"></span>${esc(V.name)}</h1>
      <div class="tools">
        <div class="seg" role="group" aria-label="دور الجهاز">
          <button data-act="role" data-v="cashier" aria-pressed="${role==="cashier"}">كاشير</button>
          <button data-act="role" data-v="bar" aria-pressed="${role==="bar"}">بار</button>
          <button data-act="role" data-v="both" aria-pressed="${role==="both"}">الكل</button>
        </div>
        <a class="btn sm" href="display.html" target="_blank" rel="noopener">شاشة الزبائن</a>
        <button class="btn sm" data-act="settings">الإعدادات</button>
        <button class="btn sm ghost" data-act="logout">خروج</button>
      </div>
    </header>
    <div class="stats">
      <span class="stat">طلبات اليوم<b>${tickets.filter(t => t.status !== "cancelled").length}</b></span>
      <span class="stat">تم الاستلام<b>${done.length}</b></span>
      <span class="stat">متوسط التحضير<b>${waits.length ? mmss(waits.reduce((a,b)=>a+b,0)/waits.length) : "—"}</b></span>
      <span class="stat">التقييم<b>${rated.length ? (rated.reduce((a,t)=>a+t.rating,0)/rated.length).toFixed(1) + " ★" : "—"}</b></span>
      <span class="stat">نودي أكثر من مرة<b>${tickets.filter(t => (t.calls||0) > 1).length}</b></span>
    </div>
    ${showNew ? `<form class="neworder" id="nf" autocomplete="off">
      ${manual ? `<input class="num" id="nno" inputmode="numeric" placeholder="رقم الفاتورة" required>` : ""}
      <input id="nnote" placeholder="ملاحظة اختيارية (مثال: ٢ لاتيه)" maxlength="80">
      <button class="btn primary big" type="submit" ${creating ? "disabled" : ""}>+ طلب جديد</button>
    </form>` : ""}
    ${showLists ? `<div class="cols">
      <section class="col"><h2>قيد التحضير <span>${waiting.length}</span></h2>
        ${waiting.length ? waiting.map(rowHTML).join("") : `<div class="empty">لا توجد طلبات قيد التحضير.</div>`}</section>
      <section class="col"><h2>تم النداء <span>${ready.length}</span></h2>
        ${ready.length ? ready.map(rowHTML).join("") : `<div class="empty">لا يوجد أحد بانتظار الاستلام.</div>`}</section>
    </div>
    <div class="cols">
      <section class="col done"><h2>آخر المستلَم <span>${done.length}</span></h2>
        ${done.length ? done.slice(0, 8).map(rowHTML).join("") : `<div class="empty">لا شيء بعد.</div>`}</section>
      <section class="col fb"><h2>ملاحظات الزبائن اليوم <span>${fbs.length}</span></h2>
        ${fbs.length ? fbs.map(t => `<div class="item"><b>${esc(t.no)}</b> · ${"★".repeat(t.rating||0)}<br>${esc(t.feedback)}</div>`).join("") : `<div class="empty">لا توجد ملاحظات خاصة.</div>`}</section>
    </div>` : ""}
  </div>
  ${showQR ? qrSheet() : ""}${settingsOpen ? settingsSheet() : ""}`;

  for (const k of ["nno","nnote"]){ const el = document.getElementById(k); if (el && keep[k] != null) el.value = keep[k]; }
  if (keep.focus && !showQR && !settingsOpen){ const f = document.getElementById(keep.focus); if (f && f.matches("input")) f.focus(); }
  if (showQR){ const el = document.getElementById("qrbox"); if (el && !el.dataset.done){ drawQR(el, customerUrl(venueId, showQR), 220); el.dataset.done = "1"; } }
  const nn = document.getElementById(manual ? "nno" : "nnote"); if (nn && showNew && !showQR && !settingsOpen && document.activeElement === document.body) nn.focus();
  tickTimers();
}

function rowHTML(t){
  let pills = "", acts = "", since = null;
  const ch = t.status === "new" ? `<span class="pill p-new">لم يمسح الرمز</span>`
    : t.channel === "push" ? `<span class="pill p-tg">إشعار الجوال ✓</span>`
    : `<span class="pill p-pg">الصفحة مفتوحة فقط</span>`;
  if (t.status === "new" || t.status === "waiting"){
    since = ms(t.linkedAt) || created(t);
    pills = ch;
    acts = `${t.status === "new" ? `<button class="btn sm" data-act="qr" data-id="${t.id}">الرمز</button><button class="btn sm ghost" data-act="cancel" data-id="${t.id}">إلغاء</button>` : ""}
      <button class="btn signal" data-act="ready" data-id="${t.id}">جاهز</button>`;
  } else if (t.status === "ready"){
    since = ms(t.readyAt) || Date.now();
    const late = !t.seenAt && Date.now() - since > NOT_SEEN_MS;
    pills = (t.seenAt ? `<span class="pill p-seen">✓ شاف النداء</span>` : late ? `<span class="pill p-miss">لم يرَ النداء</span>` : `<span class="pill p-wait">تم النداء</span>`) + ch
      + ((t.calls||0) > 1 ? `<span>${t.calls} نداءات</span>` : "");
    acts = `${!t.seenAt ? `<button class="btn sm" data-act="again" data-id="${t.id}">نادِ مرة ثانية</button>` : ""}<button class="btn primary" data-act="collect" data-id="${t.id}">تم الاستلام</button>`;
  } else if (t.status === "collected"){
    pills = t.rating ? `<span>${"★".repeat(t.rating)}</span>` : `<span>بدون تقييم</span>`;
  }
  return `<div class="row ${t.status}"><div class="no">${esc(t.no)}</div>
    <div style="min-width:0">${t.note ? `<div class="notefld">${esc(t.note)}</div>` : ""}
      <div class="meta">${pills}${since ? `<span style="font-family:var(--mono)" data-since="${since}"></span>` : ""}${t._pending ? `<span title="بانتظار الاتصال">⏳</span>` : ""}</div></div>
    <div class="acts">${acts}</div></div>`;
}

function qrSheet(){
  const t = tickets.find(x => x.id === showQR);
  if (!t) return "";
  const linked = t.status !== "new";
  return `<div class="ov" data-act="closeqr-bg"><div class="sheet" role="dialog" aria-label="رمز الطلب">
    <div style="color:var(--muted)">رقم الطلب</div><div class="bigno">${esc(t.no)}</div>
    ${linked ? `<div class="linked">✓ تم ربط جوال الزبون</div>` : `<div class="qr" id="qrbox"></div><div style="color:var(--muted)">وجّه الشاشة للزبون ليمسح الرمز</div>`}
    <button class="btn big" data-act="closeqr" style="width:100%">${linked ? "تم" : "إغلاق (الزبون بدون جوال)"}</button></div></div>`;
}
let flashTimer = null;
function linkedFlash(){ clearTimeout(flashTimer); flashTimer = setTimeout(() => { showQR = null; render(); }, 1400); }

function settingsSheet(){
  const v = V;
  return `<div class="ov"><form class="sheet form" id="sf" autocomplete="off">
    <h2 style="margin:0;font-size:18px">إعدادات المحل</h2>
    <div class="two"><div><label for="s-name">اسم المحل</label><input id="s-name" value="${esc(v.name)}" required maxlength="60"></div>
      <div><label for="s-initial">حرف الشعار</label><input id="s-initial" value="${esc(v.initial || "")}" maxlength="2"></div></div>
    <div class="two"><div><label for="s-color">لون العلامة</label><input id="s-color" type="color" value="${esc(v.color || "#7A2E3A")}" style="height:44px;padding:4px"></div>
      <div><label for="s-counter">مكان الاستلام</label><input id="s-counter" value="${esc(v.counter || "")}" placeholder="الكاونتر" maxlength="40"></div></div>
    <div><label for="s-note">سطر إضافي في شاشة النداء</label><input id="s-note" value="${esc(v.note || "")}" placeholder="مثال: المناديل جنب الباب" maxlength="80"></div>
    <div><label for="s-review">رابط تقييم Google</label><input id="s-review" type="url" dir="ltr" value="${esc(v.reviewUrl || "")}" placeholder="https://g.page/r/.../review">
      <div class="hint">من Google Business Profile ← «اطلب تقييمات». يظهر لكل الزبائن بعد الاستلام.</div></div>
    <div><label for="s-mode">رقم الطلب</label><select id="s-mode">
      <option value="auto" ${v.numberMode !== "manual" ? "selected" : ""}>تلقائي (يبدأ من 1 كل يوم)</option>
      <option value="manual" ${v.numberMode === "manual" ? "selected" : ""}>أكتب رقم الفاتورة من نظام الكاشير</option></select></div>
    <div class="actions"><button class="btn" type="button" data-act="closeset">إلغاء</button><button class="btn primary" type="submit">حفظ</button></div>
  </form></div>`;
}

async function nextNumber(){
  const cRef = doc(db, "venues", venueId, "meta", "counter");
  try {
    return await runTransaction(db, async tx => {
      const s = await tx.get(cRef); const d = s.exists() ? s.data() : {};
      const n = d.day === today ? (d.n || 0) + 1 : 1;
      tx.set(cRef, { day: today, n }); return n;
    });
  } catch(e){
    // Offline: continue from the highest number on this screen
    return tickets.reduce((m, t) => Math.max(m, parseInt(t.no, 10) || 0), 0) + 1;
  }
}

document.addEventListener("submit", async e => {
  if (e.target.id === "nf"){
    e.preventDefault(); if (creating) return;
    const manual = V.numberMode === "manual";
    const noEl = document.getElementById("nno"), noteEl = document.getElementById("nnote");
    const typed = manual ? noEl.value.trim() : "";
    if (manual && !typed) return;
    if (dayKey() !== today) listen();
    creating = true;
    try {
      const no = manual ? typed : String(await nextNumber());
      const ref = await addDoc(collection(db, "venues", venueId, "tickets"), {
        no, note: (noteEl?.value || "").trim().slice(0, 80), status: "new", day: today,
        createdAt: serverTimestamp(), calls: 0, channel: null
      });
      showQR = ref.id;
      // the form may have been redrawn by a live update while saving, so look the fields up again
      for (const k of ["nno","nnote"]){ const el = document.getElementById(k); if (el) el.value = ""; }
    } catch(err){ console.error(err); alert("تعذّر إنشاء الطلب."); }
    creating = false; render();
  }
  if (e.target.id === "sf"){
    e.preventDefault();
    const g = id => document.getElementById(id).value.trim();
    try {
      await updateDoc(doc(db, "venues", venueId), { name: g("s-name"), initial: g("s-initial"), color: g("s-color"), counter: g("s-counter"), note: g("s-note"), reviewUrl: g("s-review"), numberMode: g("s-mode") });
      settingsOpen = false; render();
    } catch(err){ console.error(err); alert("تعذّر الحفظ."); }
  }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "closeqr-bg" && e.target !== b) return;
  const ref = id ? doc(db, "venues", venueId, "tickets", id) : null;
  try {
    switch (a){
      case "role": role = b.dataset.v; try { localStorage.setItem("pg-role", role); } catch(_){} render(); break;
      case "logout": logout(); break;
      case "settings": settingsOpen = true; render(); break;
      case "closeset": settingsOpen = false; render(); break;
      case "qr": showQR = id; render(); break;
      case "closeqr": case "closeqr-bg": showQR = null; render(); break;
      case "ready": await updateDoc(ref, { status: "ready", readyAt: serverTimestamp(), calls: increment(1), seenAt: null }); break;
      case "again": await updateDoc(ref, { calls: increment(1), lastCallAt: serverTimestamp(), seenAt: null }); break;
      case "collect": await updateDoc(ref, { status: "collected", collectedAt: serverTimestamp() }); break;
      case "cancel": await updateDoc(ref, { status: "cancelled" }); break;
    }
  } catch(err){ console.error(err); alert("تعذّر تنفيذ العملية."); }
});

function tickTimers(){ document.querySelectorAll("[data-since]").forEach(el => el.textContent = mmss(Date.now() - +el.dataset.since)); }
let lastLate = "";
setInterval(() => {
  tickTimers();
  if (!V) return;
  if (dayKey() !== today) { listen(); return; }
  // re-draw when someone crosses the "not seen" line
  const late = tickets.filter(t => t.status === "ready" && !t.seenAt && Date.now() - (ms(t.readyAt)||Date.now()) > NOT_SEEN_MS).map(t => t.id).join();
  if (late !== lastLate){ lastLate = late; if (!settingsOpen && !document.activeElement?.matches("input,select")) render(); }
}, 1000);
</script>
</body>
